<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>EquiRepro</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* calm palette: warm sand background, white cards, muted sage accent */
:root{color-scheme:light;--bg:#f4f2ec;--cd:#fff;--bd:#e5e1d7;--tx:#1f2a24;--mu:#6d7b72;--pr:#2f7d5b;--on:#fff;--prt:#e6f0ea;--ok:#2a6f51;--wn:#a8620f;--wnt:#fbf0df;--sh:0 1px 2px rgba(31,42,36,.05),0 2px 8px rgba(31,42,36,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141c18;--cd:#1c2722;--bd:#2c3a33;--tx:#e8eee9;--mu:#98a99f;--pr:#6cbf97;--on:#0f1a14;--prt:#213229;--ok:#82cfa7;--wn:#e3a650;--wnt:#33291b;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141c18;--cd:#1c2722;--bd:#2c3a33;--tx:#e8eee9;--mu:#98a99f;--pr:#6cbf97;--on:#0f1a14;--prt:#213229;--ok:#82cfa7;--wn:#e3a650;--wnt:#33291b;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:400 15px/1.45 Manrope,system-ui,sans-serif;padding-block:8px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px}
[hidden]{display:none!important}.wn{color:var(--wn)}.btn:disabled{opacity:.55}
.aiw{padding:12px 14px;border-radius:12px;background:var(--prt);color:var(--ok);font-weight:700;font-size:13px;margin-top:10px}
.aires{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
table.kv{margin:6px 0}table.kv td{border:0;padding:5px 0;font-size:14px}table.kv td:first-child{color:var(--mu);width:34%;font-weight:700;font-size:12px;padding-right:8px}
h1{font-size:24px;font-weight:800;margin:14px 0 2px;letter-spacing:-.01em}
h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin:26px 0 8px}
.sub{color:var(--mu);font-size:13px;margin:0 0 6px}
.mu{color:var(--mu)}.sm{font-size:12px}.ok{color:var(--ok)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:8px 0;display:block;color:inherit;text-decoration:none;box-shadow:var(--sh)}
a.card{display:flex;justify-content:space-between;align-items:center;gap:10px}
a.card:active{background:var(--prt)}
.al{background:var(--wnt);border:0;border-left:4px solid var(--wn);border-radius:12px;padding:12px 14px;margin:8px 0}
.big{font-size:19px;font-weight:800;color:var(--ok);margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1.4fr .6fr 1fr;gap:8px}
.st{margin:0}.st small{display:block;color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.st b{font-size:16px}
label{display:block;margin:10px 0;font-size:13px;color:var(--mu);font-weight:700}
input,select,textarea{box-sizing:border-box;width:100%;min-height:46px;margin-top:4px;padding:8px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0;border-color:transparent}
input[type=range]{padding:0;min-height:30px;accent-color:var(--pr);border:0;background:none}
input[type=checkbox]{width:22px;min-height:22px;margin:0;accent-color:var(--pr);vertical-align:middle}
.btn{display:inline-block;background:var(--pr);color:var(--on);font-weight:800;border:0;border-radius:12px;padding:12px 16px;margin:10px 6px 0 0;text-decoration:none;font-size:14px;cursor:pointer}
.btn.o{background:var(--prt);color:var(--ok)}
.lnk{color:var(--ok);font-weight:700;text-decoration:none}
.ch{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--mu);white-space:nowrap;border:0}
.ch.o{background:var(--prt);color:var(--ok)}.ch.r{background:var(--wnt);color:var(--wn)}
.x{background:none;border:0;color:var(--mu);font-size:14px;cursor:pointer}
.ch2{width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:16px}
.pl{margin:6px 0;grid-template-columns:14px 1fr 1fr;align-items:center}.pl input{margin:0}
.rs{margin:6px 0 0 16px;padding:0;font-size:12px;color:var(--mu)}.bx{display:inline-block;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips .ch{background:var(--cd);color:var(--tx);min-height:36px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--bd)}
.chips .ch.sel{background:var(--pr);color:var(--on);border-color:var(--pr)}
.seg{display:flex;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.seg a{flex:1;text-align:center;padding:10px 6px;text-decoration:none;color:var(--mu);font-weight:800;font-size:14px;border-radius:10px}
.seg a.on{background:var(--pr);color:var(--on)}
.pr{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;margin-top:8px}.pr input:not([type]){margin:0}
.swb{background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:8px}.swb input{min-height:40px;margin-top:6px}.ocx{display:flex;flex-wrap:wrap;gap:6px 16px;margin:2px 0 4px}.ck{margin:0;color:var(--tx);font-size:14px;display:flex;gap:8px;align-items:center}
.ttl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:2px}
/* page header + action tiles */
.hd h1{margin:0}.hd{margin-top:10px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;color:var(--tx);text-decoration:none;font-size:12px;font-weight:700;box-shadow:var(--sh)}
.tile svg{width:22px;height:22px;color:var(--pr)}.tile.p{background:var(--pr);color:var(--on);border-color:var(--pr)}.tile.p svg{color:var(--on)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.tl{display:flex;flex-direction:column;gap:4px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;color:var(--tx);text-decoration:none;box-shadow:var(--sh);min-height:104px}
.tl svg{width:24px;height:24px;color:var(--pr)}.tl b{font-size:26px;line-height:1.1}.tl>:nth-child(2){margin-top:auto}.tl.p span,.tl span:only-of-type{font-size:15px}.tl span{font-size:13px;font-weight:700;color:var(--mu)}
.tl.p{background:var(--pr);border-color:var(--pr)}.tl.p svg,.tl.p b,.tl.p span{color:var(--on)}
.btn.w{display:block;width:100%;margin:16px 0 6px;padding:15px;font-size:15px;text-align:center}
.card label{margin:8px 0}.card .ttl+label,.card .ttl+.grid2 label{margin-top:4px}
.hint{color:var(--mu);font-size:12px;margin:6px 0 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.hrow .btn{margin:0 0 6px}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.btns3 .btn{margin:0;padding:12px 6px;text-align:center}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.phw{position:relative}
.phs{display:flex;margin:0!important;aspect-ratio:1;border:2px dashed var(--bd);border-radius:14px;overflow:hidden;align-items:center;justify-content:center;background:var(--bg);cursor:pointer}
.phs span{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);font-size:12px;width:100%;height:100%;justify-content:center}.phs svg{width:26px;height:26px;color:var(--pr)}.phs img{width:100%;height:100%;object-fit:cover}
.phx{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;border:0;display:none;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:4px;margin-top:6px}
/* week */
.td{border:2px solid var(--pr)}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.ev>span:nth-child(2){flex:1}
.card>.ev:first-child{border-top:0;padding-top:0}
.tm{font-weight:800;min-width:44px;font-size:12px;color:var(--mu)}
.ev.due .tm{color:var(--wn)}.ev.done{opacity:.65}.ev.dn>span:nth-child(2){text-decoration:line-through;opacity:.6}
/* invoice */
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;white-space:nowrap}
.tots{margin-left:auto;max-width:280px}.tots .row{padding:3px 0}
.big2{font-size:17px;border-top:2px solid var(--tx);margin-top:4px;padding-top:6px}
/* bottom navigation */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--cd);border-top:1px solid var(--bd);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);text-decoration:none;font-size:11px;font-weight:700;padding:6px 3px;border-radius:12px;min-width:44px;flex:1;max-width:72px}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--ok);background:var(--prt)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media print{:root,:root[data-theme]{--bg:#fff;--cd:#fff;--tx:#000;--mu:#555;--bd:#ccc;--sh:none}nav,.np{display:none!important}body{padding:0;max-width:none}}
/* roles: read-only screens */
body.ro #app .acts,body.ro #app .x,body.ro #app .btn,body.ro #app .ed,body.ro #app .np{display:none!important}
body.own #app .bal{display:none!important}
.media{display:grid;gap:8px}.media video,.media img{width:100%;max-height:440px;border-radius:12px;background:#000;display:block;object-fit:contain}
.login{max-width:440px;margin:0 auto}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const K='equirepro-v1',$=s=>document.querySelector(s),gv=k=>$('#f'+k).value,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF={th:35,c1:14,c2:28,hcg:[24,48],des:[36,48],cur:'SAR',clinic:'',et:{fd:8,mn:-1,mx:3,am:4,ax:8,c1:14,c2:28},
prices:[{k:'exam',n:'Ultrasound exam',p:0},{k:'hcg',n:'hCG injection',p:0},{k:'des',n:'Deslorelin',p:0},{k:'ai',n:'Insemination (fresh/cooled)',p:0},{k:'aif',n:'Insemination (frozen)',p:0},{k:'pc',n:'Pregnancy check',p:0},{k:'flush',n:'Embryo flush',p:0},{k:'et',n:'Embryo transfer',p:0},{n:'Uterine lavage',p:0},{k:'swab',n:'Uterine swab (culture / cytology)',p:0},{n:'Medication',p:0}]};
const clone=o=>JSON.parse(JSON.stringify(o));
const seed=()=>({s:clone(DEF),
mares:[{id:'M001',name:'Luna',owner:'Al-Harbi Stables',breed:'Arabian',age:8,status:'Foaled'}],
exams:[{id:1,date:'2026-10-20',time:'08:30',mare:'M001',r:28,l:22,edema:2,ov:false,ind:'None',indT:'',vet:'Dr. A',note:'Example row'},
{id:2,date:'2026-10-22',time:'08:30',mare:'M001',r:36,l:24,edema:3,ov:false,ind:'Deslorelin',indT:'2026-10-22T18:00',vet:'Dr. A',note:'Example row'},
{id:3,date:'2026-10-24',time:'08:30',mare:'M001',r:'',l:'',edema:1,ov:true,ind:'None',indT:'',vet:'Dr. A',note:'Example row'}],
ais:[{id:4,date:'2026-10-23',time:'09:30',mare:'M001',stallion:'Sultan',type:'Fresh',dose:500,vol:20,tx:'Oxytocin',vet:'Dr. A',note:'Example row',c1:'Pending',c2:'Pending'}],ev:[],bill:[]});
const norm=x=>{if(!x||!Array.isArray(x.mares))x=seed();x.s=Object.assign(clone(DEF),x.s||{});x.s.et=Object.assign(clone(DEF.et),x.s.et||{});
['exams','ais','ev','bill','rscr','rchk','et','visits','semen','media'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});if(!Array.isArray(x.s.prices))x.s.prices=clone(DEF.prices);
x.s.prices.forEach(p=>{if(!p.k&&p.n=='Uterine culture')p.k='swab'});DEF.prices.filter(p=>p.k&&!x.s.prices.some(q=>q.k==p.k)).forEach(p=>x.s.prices.push(clone(p)));return x};
let D=norm({mares:[]});
const saveLocal=()=>{srvQueue()};
const save=()=>{D._at=Date.now();saveLocal()};

// local-time helpers (fixes UTC date shift after midnight)
const loc=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString(),lt=ms=>{const x=loc(ms);return[x.slice(0,10),x.slice(11,16)]};
const today=()=>loc(Date.now()).slice(0,10),nowL=()=>loc(Date.now()).slice(0,16),addD=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const dm=d=>d.slice(8)+'/'+d.slice(5,7),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],dow=d=>new Date(d+'T00:00Z').getUTCDay(),ws=d=>addD(d,-dow(d));
const M=id=>D.mares.find(m=>m.id==id)||{name:'—',id};
const EX=id=>D.exams.filter(e=>e.mare==id).sort((a,b)=>(a.date+(a.time||'')+(a.indT||''))<(b.date+(b.time||'')+(b.indT||''))?-1:1);
const swTxt=e=>e.sw?'Swab ('+e.sw+'): '+(e.swr||'Pending')+(e.swd?' · '+e.swd:'')+(e.swtx?' · Tx: '+e.swtx:''):'';
const big=e=>Math.max(+e.r||0,+e.l||0),ovx=(e,k)=>[e[k]?e[k]+' mm':'',e[k+'cl']?'CL':'',e[k+'sf']?'SF':'',e[k+'smf']?'SMF':''].filter(Boolean).join(' + ')||'–',last=id=>EX(id).slice(-1)[0];
function st(id){const e=last(id);if(!e)return['No exams','n'];if(e.ov)return['Ovulated','o'];return big(e)>=D.s.th?['Ready','r']:['Monitor','m']}
function win(e){if(!e||e.ov||!e.indT)return null;const w=e.ind=='hCG'?D.s.hcg:e.ind=='Deslorelin'?D.s.des:null;if(!w)return null;const t=Date.parse(e.indT);return[t+w[0]*36e5,t+w[1]*36e5]}
function cd(a,b){const n=Date.now(),f=ms=>{const m=Math.round(ms/6e4);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};return n<a?'Window opens in '+f(a-n):n<b?'In window · closes in '+f(b-n):'Window passed · confirm ovulation'}
function alerts(){const o=[];D.mares.forEach(m=>{const e=last(m.id);if(!e||e.ov)return;const w=win(e);
if(w)o.push(`<div class="al"><b>${esc(m.name)}</b> <span class="mu sm">${esc(e.ind)} given ${esc(e.indT.replace('T',' '))}</span><div class="big cd" data-a="${w[0]}" data-b="${w[1]}">${cd(w[0],w[1])}</div></div>`);
else if(big(e)>=D.s.th)o.push(`<div class="al"><b>${esc(m.name)}</b> <span class="mu sm">${big(e)} mm</span><div>Follicle at/above threshold: induce / inseminate per protocol</div></div>`)});
D.exams.filter(e=>e.sw&&(e.swr||'Pending')=='Pending').forEach(e=>o.push(`<div class="al"><b>${esc(M(e.mare).name)}</b> Swab result pending <span class="mu sm">(${esc(e.sw)}, taken ${dm(e.date)})</span> <a class="lnk" href="#mare-${esc(e.mare)}">Update ›</a></div>`));
D.ais.forEach(a=>[1,2].forEach(k=>{const d=addD(a.date,D.s['c'+k]);if(a['c'+k]=='Pending'&&d<=addD(today(),2))o.push(`<div class="al"><b>${esc(M(a.mare).name)}</b> Pregnancy check ${k} due ${dm(d)}</div>`)}));
return o.join('')||'<p class="mu">No alerts right now.</p>'}
const IC={mares:'<path d="M4 6h16M4 12h16M4 18h11"/>',week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
exam:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/>',et:'<circle cx="12" cy="12" r="8"/><circle cx="10" cy="10.5" r="2"/><circle cx="14.5" cy="14" r="2"/>',
bills:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
ai:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',clip:'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3"/>',check:'<path d="M5 12l4 4 10-10"/>',plus:'<path d="M12 5v14M5 12h14"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',home:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',pin:'<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'};
const hdr=(t,sub,back)=>`${back?`<a class="lnk back" href="${back[0]}">‹ ${esc(back[1])}</a>`:''}<div class="hd"><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`;
const sec=(t,b)=>`<div class="card"><div class="ttl">${t}</div>${b}</div>`;
const sbtn=(l,f)=>`<button class="btn w" onclick="${f}">${l}</button>`;
const ic=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
let MF='all';
function setMF(k){MF=k;document.querySelectorAll('#mf .ch').forEach(b=>b.classList.toggle('sel',b.dataset.k==k));flt()}
function list(q){q=q.toLowerCase();return D.mares.filter(m=>(MF=='all'||(MF=='mare'&&role(m)!='Recipient')||role(m)==MF)&&(m.id+m.name).toLowerCase().includes(q)).map(m=>{const e=last(m.id),[s,c]=st(m.id);return `<a class="card" href="#mare-${esc(m.id)}"><div><b>${esc(m.name)}</b> <span class="mu sm">${esc(m.id)} · ${esc(m.breed||'')}</span><div class="mu sm">${e?'Last exam '+dm(e.date)+' · '+(big(e)||'–')+' mm':'No exams yet'}</div>${role(m)=='Recipient'?`<div class="sm">Recipient · ${esc(m.cyc||'Cyclic')}</div>`:purp(m)?`<div class="sm">${esc(purp(m))}</div>`:''}</div><span class="ch ${c}">${s}</span></a>`}).join('')||'<p class="mu">No files here yet.</p>'}
const flt=()=>{$('#list').innerHTML=list($('#q').value)};
function home(){const t=today(),due=evs(t).filter(x=>x.k!='done'&&!(x.e&&x.e.done)).length,nR=REC().length,al=alerts();
return`<div class="hd"><h1>EquiRepro</h1><p class="sub">${DN[dow(t)]} ${dm(t)}/${t.slice(0,4)}${D.s.clinic?' · '+esc(D.s.clinic):''}</p></div>
<div class="tiles2">
<a class="tl" href="#files-mare">${ic('mares')}<b>${D.mares.length-nR}</b><span>Mare files</span></a>
<a class="tl" href="#files-Recipient">${ic('et')}<b>${nR}</b><span>Recipient files</span></a>
<a class="tl p" href="#exam">${ic('exam')}<span>New exam</span></a>

function evs(d){const o=[];
D.ev.filter(e=>e.date==d).forEach(e=>o.push({t:e.time||'',m:e.mare,l:e.type+(e.note?' · '+e.note:''),k:'ev',e}));
D.exams.filter(e=>e.date==d).forEach(e=>o.push({t:e.time||'',m:e.mare,l:'Exam · R '+ovx(e,'r')+' / L '+ovx(e,'l')+(e.ov?' · ovulated':''),k:'done'}));
D.ais.filter(a=>a.date==d).forEach(a=>o.push({t:a.time||'',m:a.mare,l:'Insemination · '+(a.stallion||'')+' ('+a.type+')',k:'done'}));
D.ais.forEach(a=>[1,2].forEach(k=>{if(addD(a.date,D.s['c'+k])==d){const r=a['c'+k];o.push({t:'',m:a.mare,l:'Pregnancy check '+k+(r!='Pending'?' · '+r:''),k:r=='Pending'?'due':'done'})}}));
D.mares.forEach(m=>{const e=last(m.id),w=win(e);if(!w)return;const[a1,t1]=lt(w[0]),[b1,t2]=lt(w[1]);
if(a1==d)o.push({t:t1,m:m.id,l:'Ovulation window opens ('+e.ind+')',k:'due'});if(b1==d)o.push({t:t2,m:m.id,l:'Ovulation window closes · scan',k:'due'})});
D.mares.filter(m=>role(m)=='Recipient'&&acy(m)).forEach(m=>{if(m.e2==d)o.push({t:'',m:m.id,l:'Start estradiol priming',k:d<=today()?'done':'due'});if(m.p4==d)o.push({t:'',m:m.id,l:'Start progestin (day 0) · '+(m.p4prod||''),k:d<=today()?'done':'due'})});
D.et.filter(t=>t.date==d).forEach(t=>o.push({t:t.time||'',m:t.rec,l:'Embryo transfer from '+M(t.donor).name+' (D'+t.eday+' '+t.stage+', G'+t.grade+')',k:'done'}));
D.et.forEach(t=>[1,2].forEach(k=>{if(etDue(t,k)==d){const r=t['c'+k];o.push({t:'',m:t.rec,l:'ET pregnancy check '+k+(r!='Pending'?' · '+r:''),k:r=='Pending'?'due':'done'})}}));
D.mares.filter(m=>role(m)=='Donor').forEach(m=>{const ov=ovInfo(m.id);if(!ov)return;if(addD(ov.d,D.s.et.fd)==d&&!D.et.some(t=>t.donor==m.id&&t.date>=ov.d))o.push({t:'',m:m.id,l:'Embryo flush, day '+D.s.et.fd+(ov.p?' (predicted)':'')+' · pick recipient',k:'due'})});
D.visits.filter(v=>v.date==d).forEach(v=>{const ms=vMares(v);o.push({t:v.time||'',m:'',h:'#visits-'+d,n:v.farm||'Farm visit',l:'Farm visit · '+(v.purpose||'')+(ms.length?' · '+ms.map(m=>vName(m)+(m.target?' → '+m.target:'')).join(', '):''),k:v.done?'done':'due',ms:ms.map(m=>m.id).filter(Boolean)})});
D.semen.filter(s=>s.ship==d&&s.status!='Cancelled').forEach(s=>o.push({t:'',m:'',h:'#semenf-'+s.id,n:(s.stallion||'Semen')+' semen',l:'Ship to '+(s.buyer||'buyer')+(s.doses?' · '+s.doses+' doses':''),k:/Shipped|Delivered/.test(s.status||'')?'done':'due'}));
return o.sort((a,b)=>(a.t||'99')<(b.t||'99')?-1:1)}
const dayList=d=>evs(d).map(x=>`<div class="ev ${x.k}${x.e&&x.e.done?' dn':''}"><span class="tm">${x.t||'—'}</span><span><a class="lnk" href="${x.h?x.h:'#mare-'+esc(x.m)}">${esc(x.n||M(x.m).name)}</a> ${esc(x.l)}</span>${x.k=='ev'?`<span><input type="checkbox" title="Done" ${x.e.done?'checked':''} onchange="tog(${x.e.id})"> <button class="x" onclick="del('ev',${x.e.id},this)">✕</button></span>`:''}</div>`).join('')||'<div class="mu sm">Nothing scheduled</div>';
function week(a){const off=parseInt(a)||0,t=today(),s=addD(ws(t),off*7);let h=`<div class="hrow"><div class="hd"><h1>Week</h1><p class="sub">${dm(s)} – ${dm(addD(s,6))}</p></div><a class="btn" href="#addev-${off?s:t}">+ Schedule</a></div><div class="seg"><a href="#week-${off-1}">‹ Previous</a><a href="#week" class="${off?'':'on'}">This week</a><a href="#week-${off+1}">Next ›</a></div>`;
for(let i=0;i<7;i++){const d=addD(s,i);h+=`<div class="card${d==t?' td':''}"><div class="row"><b>${DN[i]} ${dm(d)}${d==t?' · Today':''}</b><a class="lnk sm" href="#addev-${d}">+ Add</a></div>${dayList(d)}</div>`}
return h+'<p class="hint">Exams, inseminations, pregnancy checks, induction windows and transfers appear automatically. Use + Add for anything else.</p>'}
function upcoming(id){const o=[];for(let i=0;i<14;i++){const d=addD(today(),i);evs(d).filter(x=>(x.m==id||(x.ms&&x.ms.includes(id)))&&x.k!='done'&&!(x.e&&x.e.done)).forEach(x=>o.push(`<div class="ev ${x.k}"><span class="tm">${dm(d)}</span><span>${esc(x.t)} ${esc((x.n?x.n+' · ':'')+x.l)}</span></div>`))}return o.join('')||'<div class="mu sm">Nothing in the next 14 days</div>'}

function saveEv(){const date=gv('date');if(!date)return;D.ev.push({id:Date.now(),date,time:gv('time'),mare:gv('mare'),type:gv('ty'),note:gv('note'),done:false});save();

/* ---------- BREEDING PLAN (purpose + stallion) ---------- */

function planRows(m,live){const id=m?esc(m.id):'';const row=(k,t)=>`<div class="pr"><label class="ck"><input type="checkbox" id="fp${k}" ${m&&m['p'+k]?'checked':''} ${live?`onchange="setPlan('${id}')"`:''}> ${t}</label><input id="fs${k}" placeholder="Stallion" value="${esc(m?m['st'+k]||'':'')}" ${live?`onchange="setPlan('${id}')"`:''}></div>`;
return`<div class="card"><div class="ttl">Purpose · stallion</div>${row('AI','Insemination')}${row('ET','Embryo transfer')}</div>`}
const readPlan=()=>({pAI:$('#fpAI').checked,stAI:gv('sAI').trim(),pET:$('#fpET').checked,stET:gv('sET').trim()});
function setPlan(id){const m=M(id);Object.assign(m,readPlan());if(m.pET&&role(m)=='Client')m.role='Donor';save();route()}
const purp=m=>[m.pAI?'AI'+(m.stAI?': '+m.stAI:''):'',m.pET?'ET'+(m.stET?': '+m.stET:''):''].filter(Boolean).join(' · ');

/* ---------- ACYCLIC RECIPIENTS (hormone protocol) ---------- */
const acy=m=>m.cyc=='Acyclic',P4P=['Altrenogest (daily oral)','Long-acting progesterone (injection)','Progesterone in oil (daily)','Other'];
function hormRows(m,live){const id=m?esc(m.id):'',oc=live?`onchange="setHorm('${id}')"`:'';
return`<div class="card"><div class="ttl">Hormone protocol</div><div class="grid2"><label>Estradiol priming start<input id="fe2" type="date" value="${esc(m&&m.e2||'')}" ${oc}></label><label>Progestin start (day 0)<input id="fp4" type="date" value="${esc(m&&m.p4||'')}" ${oc}></label></div><label>Progestin product<select id="fprod" ${oc}>${P4P.map(x=>`<option${m&&m.p4prod==x?' selected':''}>${x}</option>`).join('')}</select></label><p class="mu sm" style="margin:0">Leave the progestin date empty until you start; the ET planner tells you which dates would fit a donor's transfer.</p></div>`}
const readHorm=()=>({e2:gv('e2'),p4:gv('p4'),p4prod:gv('prod')});
function setHorm(id){Object.assign(M(id),readHorm());save();route()}

function aStat(r){if(r.p4){const n=dd(r.p4,today());return'Acyclic · '+(n<0?'progestin starts '+dm(r.p4):'progestin day '+n+' (started '+dm(r.p4)+')')}return'Acyclic · '+(r.e2?'estradiol priming since '+dm(r.e2):'no hormone protocol recorded')}

/* ---------- EMBRYO TRANSFER: RECIPIENTS ---------- */
const role=m=>m.role||'Client',REC=()=>D.mares.filter(m=>role(m)=='Recipient'),DON=()=>D.mares.filter(m=>role(m)!='Recipient');
const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5),sg=n=>(n>0?'+':n<0?'−':'±')+Math.abs(n);
const lastOf=(t,id)=>D[t].filter(x=>x.mare==id).sort((a,b)=>a.date<b.date?-1:1).slice(-1)[0];
const sel=(id,arr,v)=>`<select id="f${id}">${arr.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
const etDue=(t,k)=>addD(t.date,D.s.et['c'+k]-t.eday);
const reasons=L=>L.length?`<ul class="rs">${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
// current-cycle ovulation: predicted from an active induction, else a recorded ovulation within 18 days
function ovInfo(id){const e=last(id),o=EX(id).filter(x=>x.ov).slice(-1)[0];
if(e&&!e.ov){const w=win(e);if(w)return{d:lt((w[0]+w[1])/2)[0],p:1}}
if(o&&dd(o.date,today())<=18)return{d:o.date,p:0};return null}
function rStat(r){if(acy(r))return aStat(r);const o=ovInfo(r.id),e=last(r.id);return o?(o.p?'Expected to ovulate '+dm(o.d):'Day '+dd(o.d,today())+' after ovulation ('+dm(o.d)+')'):e?'Last exam '+dm(e.date)+' · '+(big(e)?big(e)+' mm':'no follicle recorded'):'No exams yet'}
// recipient screening: suitability for the recipient herd
function scr(s){const f=[],w=[],a=+s.age,b=+s.bcs,fl=+s.fl;
if(s.age!==''&&s.age!=null){if(a<3)f.push('Under 3 years');else if(a>15)f.push('Over 15 years');else if(a>12)w.push('Age '+a+' (over 12)')}
if(s.bcs!==''&&s.bcs!=null){if(b<4||b>8)f.push('Body condition '+b+'/9');else if(b==4||b==8)w.push('Body condition '+b+'/9')}
if(s.tract=='Abnormal')f.push('Abnormal tract on palpation/ultrasound');
if(s.cx=='Abnormal / damaged')f.push('Cervix abnormal or damaged');
if(fl>2)f.push('Intrauterine fluid '+fl+' mm');else if(fl>0)w.push('Intrauterine fluid '+fl+' mm');
if(s.cyt=='Positive')f.push('Cytology positive (inflammation)');if(s.cul=='Positive')f.push('Culture positive');
if(s.cyt=='Not done'&&s.cul=='Not done')w.push('No cytology or culture');
if(s.cyc=='Irregular / not cycling')w.push('Not cycling regularly');if(s.tem=='Difficult')w.push('Difficult to handle');
return f.length?['Not suitable','r',f.concat(w)]:w.length?['Conditional','m',w]:['Approved','o',[]]}
// transfer-day evaluation
function cg(c){const f=[],w=[],fl=+c.fl,ed=+c.ed;
if(c.cl=='None')f.push('No CL');else if(c.cl!='Good'&&!/^Not applicable/.test(c.cl))w.push('CL small / poorly defined');
if(c.ut=='Poor')f.push('Poor uterine tone');else if(c.ut=='Fair')w.push('Fair uterine tone');
if(c.cx=='Soft / open')f.push('Cervix soft / open');else if(c.cx=='Moderate')w.push('Cervix moderate tone');
if(fl>0)f.push('Intrauterine fluid '+fl+' mm');
if(ed>=2)f.push('Uterine edema '+ed);else if(ed==1)w.push('Uterine edema 1');
return f.length?['Not acceptable','r',f.concat(w)]:w.length?['Acceptable','m',w]:['Ready','o',[]]}
let FD=null,LD='';
function planner(did,fd){if(!did)return'<p class="mu">Add a donor mare first (Role: Donor).</p>';
const o=ovInfo(did),dn=esc(M(did).name);
if(!o)return`<div class="al"><b>${dn}</b>: no ovulation in the last 18 days and no active induction. Record her ovulation on the <a class="lnk" href="#exam-${esc(did)}">Exam</a> page (Ovulation: Yes), or record an hCG/Deslorelin induction to plan from the predicted date.</div>`;
const T=addD(o.d,fd),mn=D.s.et.mn,mx=D.s.et.mx;
const am=D.s.et.am,ax=D.s.et.ax,ws3=(v,lo,hi)=>v>=lo&&v<=hi?['In window','o',0]:v>=lo-1&&v<=hi+1?['Borderline','m',1]:['Out of window','r',2];
const rows=REC().map(r=>{const A=acy(r),s=lastOf('rscr',r.id),c=lastOf('rchk',r.id),v=s?scr(s):['Not screened','m',[]],g=c?cg(c):null;
let ro=null,sync=null,pd=null,w,txt,used=false,dist=0;
if(A){pd=r.p4?dd(r.p4,T):null;used=!!r.p4&&D.et.some(t=>t.rec==r.id&&t.date>=r.p4);
 w=pd==null?['No progestin start','n',3]:ws3(pd,am,ax);dist=pd==null?0:Math.abs(pd-(am+ax)/2);
 txt=r.p4?`Acyclic · progestin from ${dm(r.p4)} · <b>P4 day ${pd}</b> on transfer day`:`Acyclic · to fit this transfer start progestin <b>${dm(addD(T,-ax))} – ${dm(addD(T,-am))}</b>`;
 if(r.p4&&w[2]==2&&r.p4>=today())txt+=` <span class="mu">(to fit: start ${dm(addD(T,-ax))} – ${dm(addD(T,-am))})</span>`}
else{ro=ovInfo(r.id);sync=ro?dd(o.d,ro.d):null;used=!!ro&&D.et.some(t=>t.rec==r.id&&t.date>=ro.d);
 w=sync==null?['No ovulation data','n',3]:ws3(sync,mn,mx);dist=sync==null?0:Math.abs(sync-1);
 txt=ro?(ro.p?'Expected ovulation ':'Ovulated ')+dm(ro.d)+' · '+sg(sync)+' d vs donor · <b>day '+(fd-sync)+'</b> on transfer day':esc(rStat(r))}
if(used)w=['Already used this cycle','r',4];
const bad=v[0]=='Not suitable'||(g&&g[0]=='Not acceptable'),sc=(bad&&w[2]<2?150:0)+w[2]*100+({Approved:0,Conditional:1,'Not screened':1,'Not suitable':3}[v[0]])*10+(g?{Ready:0,Acceptable:1,'Not acceptable':5}[g[0]]:2)+dist*.1;
return{r,v,c,g,w,sc,txt}}).sort((a,b)=>a.sc-b.sc);
const h=`<div class="al"><b>${dn}</b> ${o.p?'is expected to ovulate':'ovulated'} ${DN[dow(o.d)]} ${dm(o.d)}${o.p?' (predicted from induction)':''}
<div class="big">Flush &amp; transfer: ${DN[dow(T)]} ${dm(T)}</div>
<div class="sm">Day ${fd} embryo. Recipients in window ovulated <b>${dm(addD(o.d,mn))} – ${dm(addD(o.d,mx))}</b> (${sg(mn)} to ${sg(mx)} days vs donor), so they are on <b>day ${fd-mx} to ${fd-mn}</b> after their own ovulation on transfer day.</div>${REC().some(acy)?`<div class="sm" style="margin-top:4px">Acyclic recipients: <b>progestin day ${am} to ${ax}</b> on transfer day, i.e. progestin started <b>${dm(addD(T,-ax))} – ${dm(addD(T,-am))}</b>.</div>`:''}</div>`;
if(!rows.length)return h+'<p class="mu">No recipients yet. Add one below.</p>';
return h+rows.map(x=>{const id=esc(x.r.id);return`<div class="card"><div class="row"><a class="lnk" href="#mare-${id}"><b>${esc(x.r.name)}</b></a><span class="ch ${x.w[1]}">${x.w[0]}</span></div>
<div class="sm">${x.txt}</div>
<div class="sm bx">Screening <span class="ch ${x.v[1]}">${x.v[0]}</span> ${x.g?`· Check ${dm(x.c.date)} <span class="ch ${x.g[1]}">${x.g[0]}</span>`:'· <span class="mu">no transfer-day check yet</span>'}</div>
${reasons([...(x.v[0]!='Approved'?x.v[2]:[]),...(x.g?x.g[2]:[])])}
<a class="btn o" href="#rchk-${id}">Evaluate</a>${x.w[2]<=1?`<a class="btn" href="#etrec-${esc(did)}_${id}">Record transfer</a>`:''}</div>`}).join('')}
function et(a){const fd=FD||D.s.et.fd,dons=DON(),did=dons.some(m=>m.id==a)?a:(LD&&dons.some(m=>m.id==LD)?LD:(dons.find(m=>role(m)=='Donor')||{}).id||'');LD=did;
return`${hdr('Embryo transfer','Plan the transfer window, evaluate recipients, record embryos')}
${sec('Donor &amp; flush day',`${dons.length?`<label>Donor<select onchange="location.hash='et-'+this.value">${dons.map(m=>`<option value="${esc(m.id)}"${m.id==did?' selected':''}>${esc(m.name)} (${esc(m.id)})${role(m)=='Donor'?' · donor':''}</option>`).join('')}</select></label>`:''}<div class="chips">${[6,7,8,9].map(n=>`<button type="button" class="ch${n==fd?' sel':''}" onclick="FD=${n};route()">Day ${n}</button>`).join('')}</div>`)}

${REC().map(r=>{const s=lastOf('rscr',r.id),v=s?scr(s):['Not screened','m',[]],c=lastOf('rchk',r.id),g=c?cg(c):null,id=esc(r.id);return`<div class="card"><div class="row"><a class="lnk" href="#mare-${id}"><b>${esc(r.name)}</b></a><span class="ch ${v[1]}">${v[0]}</span></div><div class="sm">${esc(rStat(r))}${g?` · last check ${dm(c.date)}: ${g[0]}`:''}</div><div class="btns3"><a class="btn o" href="#rscr-${id}">Screen</a><a class="btn o" href="#rchk-${id}">Evaluate</a><a class="btn o" href="#exam-${id}">Exam</a></div></div>`}).join('')||'<p class="mu">No recipients yet.</p>'}
<h2>Transfers</h2>${etList(()=>true)}`}

async function pullRemote(c,md){const n=md.n||{},R={};for(const k of SK){const cnt=n[k]||0;if(!cnt)continue;let s='';for(let i=0;i<cnt;i++){const d=await c.doc(k+'-'+i).get();if(!d.exists)throw{code:'missing'};s+=(d.data()||{}).c||''}R[k]=s}return R}
// three-way merge: base = last copy both sides agreed on (SYNCED); a record changed locally keeps the local version, otherwise the account version wins
function merge3(R){const ld=D._del||{},rd=R._del?JSON.parse(R._del)||{}:{},del={};
LIST.forEach(k=>{del[k]=new Set([...(ld[k]||[]),...(rd[k]||[])].map(String))});
const out={_del:{}};LIST.forEach(k=>{out._del[k]=[...del[k]].slice(-3000)});
for(const k of SK){if(k=='_del'||R[k]===undefined)continue;const rs=R[k],bs=SYNCED[k],ls=JSON.stringify(D[k]??null);
 if(!LIST.includes(k)){out[k]=bs!==undefined&&ls!==bs?D[k]:JSON.parse(rs);continue}
 const rv=JSON.parse(rs)||[],bv=bs?JSON.parse(bs)||[]:[],lv=D[k]||[];
 const bm=new Map(bv.map(x=>[String(x.id),JSON.stringify(x)])),lm=new Map(lv.map(x=>[String(x.id),x])),rm=new Map(rv.map(x=>[String(x.id),x]));
 out[k]=[...new Set([...rm.keys(),...lm.keys()])].filter(id=>!del[k].has(id)).map(id=>{const l=lm.get(id),r=rm.get(id);if(!l)return bm.has(id)?null:r;if(!r)return bm.has(id)&&JSON.stringify(l)===bm.get(id)?null:l;return JSON.stringify(l)!==bm.get(id)?l:r}).filter(Boolean)}
Object.assign(D,out);D=norm(D);Object.keys(R).forEach(k=>{SYNCED[k]=R[k]})}
const HOLD='d'+Math.random().toString(36).slice(2),wait=ms=>new Promise(r=>setTimeout(r,ms));
// short lease so two phones saving at the same moment take turns instead of overwriting each other
async function lock(c){const L=c.doc('lock');for(let i=0;i<50;i++){let r;try{r=await L.acquire({holder:HOLD,ttlMs:8000})}catch(e){return false}if(r&&r.acquired)return true;await wait(300+Math.random()*400)}return false}
const unlock=c=>c.doc('lock').acquire({holder:HOLD,ttlMs:1000}).catch(()=>{});
async function pushDb(){if(!DB)return;if(pushing){again=true;return}pushing=true;SYNC='Saving to your Claude account…';updSync();const c=ucol();let got=false;
try{got=await lock(c);
 if(!FORCE){const m=await c.doc('meta').get();if(m.exists){const md=m.data()||{};if((md.at||0)!==LASTAT){merge3(await pullRemote(c,md));PREVN=md.n||{};LASTAT=md.at||0;softRoute()}}}
 FORCE=false;const n={};
 for(const k of SK){const str=JSON.stringify(D[k]??null),parts=[];for(let i=0;i<str.length;i+=CHUNK)parts.push(str.slice(i,i+CHUNK));n[k]=parts.length;
  if(SYNCED[k]!==str){for(let i=0;i<parts.length;i++)await c.doc(k+'-'+i).set({c:parts[i]});for(let i=parts.length;i<(PREVN[k]||0);i++)await c.doc(k+'-'+i).delete();SYNCED[k]=str}}
 const at=Date.now();D._at=at;saveLocal();await c.doc('meta').set({n,at,v:2});LASTAT=at;PREVN=n;saveBase();SYNC='Synced with your Claude account at '+lt(at)[1]+'.'}
catch(e){SYNC=e&&e.code=='quota_exceeded'?'Account storage is full. Export, then remove old records.':'Not synced yet; kept on this device. It retries on your next change.'}
finally{if(got)unlock(c);pushing=false;updSync();if(again){again=false;pushDb()}}}
let PT=0;
async function pullNow(tries){if(!DB)return;if(pushing){PT=setTimeout(()=>pullNow(tries),800);return}const c=ucol();
 try{const m=await c.doc('meta').get();if(!m.exists)return;const md=m.data()||{};if((md.at||0)===LASTAT)return;
  const R=await pullRemote(c,md);if(pushing){PT=setTimeout(()=>pullNow(tries),800);return}
  const local=SK.some(k=>JSON.stringify(D[k]??null)!==SYNCED[k]);merge3(R);LASTAT=md.at||0;PREVN=md.n||{};saveLocal();saveBase();
  SYNC='Updated from another device at '+lt(Date.now())[1]+'.';softRoute();if(local)queuePush()}
 catch(e){if((tries||0)<4)PT=setTimeout(()=>pullNow((tries||0)+1),1500)}}
function watchRemote(){ucol().doc('meta').onSnapshot(s=>{if(!s.exists)return;const md=s.data()||{};if((md.at||0)===LASTAT)return;clearTimeout(PT);PT=setTimeout(()=>pullNow(0),300)},()=>{})}
async function cloudInit(){if(!IN_ART)return;
claude.use('sample').then(async sm=>{SAMPLE=sm;if(sm){const l=await sm.limits().catch(()=>null);SIMG=l&&l.images?l.images.maxCount:0}SREADY=true;updAI()});
claude.use('downloads').then(d=>{DL=d});
const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user){SYNC='Saved in this browser only.';updSync();return}
const uid=await user.id().catch(()=>null);if(!uid){SYNC='Saved in this browser only (sign in to sync).';updSync();return}
DB=db;UID=uid;
try{const c=ucol(),m=await c.doc('meta').get();
 if(m.exists){const md=m.data()||{},R=await pullRemote(c,md);PREVN=md.n||{};
  if(HASBASE)merge3(R);
  else{// first time this device connects: take the account copy and add this device's own records to it
   const mine=D._at?clone(D):null;const nd={};Object.keys(R).forEach(k=>{nd[k]=JSON.parse(R[k]);SYNCED[k]=R[k]});D=norm(nd);if(mine)mergeIn(mine)}
  LASTAT=md.at||0;saveLocal();saveBase();SYNC='Synced with your Claude account.';route();
  if(SK.some(k=>JSON.stringify(D[k]??null)!==SYNCED[k]))await pushDb();else updSync()}
 else await pushDb();
 watchRemote()}
catch(e){DB=null;SYNC='Could not read your account copy, so syncing is paused for this visit. This device\'s records are unchanged.';updSync()}}
// add another set of records (a backup, or this device's own) without replacing: same mare = same ID and name, or same name and owner
function mergeIn(o){o=norm(clone(o));const map={},low=s=>String(s||'').trim().toLowerCase(),cnt={files:0,records:0};
o.mares.forEach(m=>{const byId=D.mares.find(x=>x.id==m.id),byName=D.mares.find(x=>low(x.name)==low(m.name)&&low(x.owner)==low(m.owner));
 if(byId&&low(byId.name)==low(m.name))return;if(byName){map[m.id]=byName.id;return}
 if(byId){const nidv=nid((m.id.match(/^[A-Za-z]+/)||['M'])[0]);map[m.id]=nidv;m.id=nidv}
 D.mares.push(m);cnt.files++});
const R=id=>map[id]||id,del=D._del||{};
LIST.filter(k=>k!='mares').forEach(k=>{const have=new Set(D[k].map(x=>String(x.id))),gone=new Set((del[k]||[]).map(String));
 o[k].forEach(x=>{if(have.has(String(x.id))||gone.has(String(x.id))||x.note=='Example row')return;
  if('mare' in x)x.mare=R(x.mare);if('donor' in x){x.donor=R(x.donor);x.rec=R(x.rec)}if(Array.isArray(x.mares))x.mares=x.mares.map(m=>m.id?{...m,id:R(m.id)}:m);
  D[k].push(x);cnt.records++})});
return cnt}

const KEY_K='equirepro-apikey',MOD_K='equirepro-model',MODELS=[['claude-sonnet-5-5','Sonnet 5.5 · faster, cheaper'],['claude-opus-5-5','Opus 5.5 · most careful']];
const getKey=()=>{try{return localStorage.getItem(KEY_K)||''}catch(e){return''}};
const getModel=()=>{try{return localStorage.getItem(MOD_K)||MODELS[0][0]}catch(e){return MODELS[0][0]}};
function aiMode(){if(SAMPLE&&SIMG)return'sample';if(!IN_ART&&getKey())return'key';if(IN_ART&&!SREADY)return'wait';return'none'}
const aiMax=()=>aiMode()=='sample'?Math.min(3,SIMG):3,cap=t=>String(t||'').charAt(0).toUpperCase()+String(t||'').slice(1);
function aiPrompt(mid){const m=M(mid),e=last(mid),o=ovInfo(mid);
const ctx=[`Mare ${m.name} (${role(m)}${role(m)=='Recipient'?', '+(m.cyc||'Cyclic'):''}${m.age?', '+m.age+' years':''}${m.breed?', '+m.breed:''}).`,
e?`Last recorded exam ${e.date}: right ovary largest follicle ${e.r||'not recorded'} mm, left ${e.l||'not recorded'} mm${[e.rcl?'CL right':'',e.lcl?'CL left':'',e.rsf?'SF right':'',e.lsf?'SF left':'',e.rsmf?'small multiple follicles right':'',e.lsmf?'small multiple follicles left':''].filter(Boolean).map(x=>', '+x).join('')}, uterine edema ${e.edema}/5${e.es?', '+e.es.toLowerCase()+' estrus':''}${e.sw?', '+swTxt(e).toLowerCase():''}${e.ov?', ovulation recorded':''}${e.ind&&e.ind!='None'?', '+e.ind+' given '+(e.indT||'').replace('T',' '):''}.`:'No previous exams recorded.',
o?(o.p?`Ovulation expected around ${o.d}.`:`Ovulation recorded on ${o.d}.`):''].filter(Boolean).join(' ');
return `You are assisting an equine reproduction veterinarian. The attached image(s) are B-mode transrectal ultrasound images of a mare's reproductive tract, often photographed from the scanner screen with a phone. Today is ${today()}.
Clinic record: ${ctx}
This clinic grades uterine edema 0-5: 0 none, 1 minimal, 2 mild, 3 moderate (clear cartwheel pattern), 4 marked, 5 excessive or abnormal.
For the images:
1. Say what is shown (ovary, uterus, early pregnancy, mixed, unclear) and the side if a label (LO/RO, L/R) is visible.
2. Read any on-screen text: caliper measurements, depth scale, labels, date. Copy measurements exactly.
3. Follicles: give a diameter in mm only from an on-screen caliper value (source "screen") or a clearly visible depth scale (source "estimated"); otherwise null. Note signs of approaching ovulation (loss of round shape, thickened or echogenic wall, echogenic particles) or of a hemorrhagic or anovulatory follicle.
4. Corpus luteum: present, absent or unclear.
5. Uterus: edema grade on the 0-5 scale, intrauterine fluid (depth in mm if measurable, echogenicity), cysts.
6. Pregnancy: embryonic vesicle present, its diameter, approximate gestational age in days, whether a second vesicle (twins) is suspected. Endometrial cysts can mimic a vesicle, and a still image cannot show a heartbeat.
7. Image quality.
Never invent a number you cannot see or measure: use null. Reply with only this JSON object:
{"view":"ovary|uterus|pregnancy|mixed|unclear","side":"left|right|unknown","screenText":"","follicles":[{"side":"left|right|unknown","mm":null,"source":"screen|estimated|none","notes":""}],"cl":"present|absent|unclear","edema":null,"fluid":{"present":false,"depthMm":null,"echogenicity":""},"cysts":"","pregnancy":{"vesicle":false,"diameterMm":null,"estDays":null,"twinsSuspected":false},"quality":"good|fair|poor","summary":"2-3 plain sentences for the vet","cautions":["short points the vet should check"]}`}
const parseJ=t=>{try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)try{return JSON.parse(f[1])}catch(e){}
const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(t.slice(a,b+1))}catch(e){}throw{code:'invalid_json'}};
function toJpeg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1568/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85).split(',')[1])};im.onerror=()=>{URL.revokeObjectURL(u);rej({code:'image_rejected'})};im.src=u})}
async function aiAsk(prompt,files,signal){const md=aiMode();
if(md=='sample')return SAMPLE.json(prompt,{images:files,signal});
if(md=='key'){const imgs=await Promise.all(files.map(toJpeg));
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:getModel(),max_tokens:4000,messages:[{role:'user',content:[...imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text:prompt}]}]})}).catch(e=>{throw{code:e&&e.name=='AbortError'?'cancelled':'network'}});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:'api',status:r.status,message:(j.error&&j.error.message)||('HTTP '+r.status)};
 return parseJ((j.content||[]).filter(c=>c.type=='text').map(c=>c.text).join(''))}
throw{code:'unavailable'}}
function aiErr(e){const c=e&&e.code;return({not_granted:'Claude access was declined for this page. Reload the page to be asked again.',sampling_disabled:'Claude is not available on this account.',
rate_limited:'Too many requests, or your usage limit is reached. Try again later.',image_rejected:'One photo could not be read. Use a JPEG or PNG under 20 MB.',
invalid_json:'The answer came back in the wrong format. Tap Analyze again.',refused:'Claude declined to read these images.',network:'No connection to the Claude API. Check the internet and try again.',
images_unavailable:'This view cannot send photos to Claude.',session_expired:'Sign in to claude.ai again, then retry.'})[c]
||(c=='api'?(e.status==401?'The API key was rejected. Check it in Settings.':e.status==429?'API rate or credit limit reached. Try again later.':'API error: '+(e.message||e.status)):'Something went wrong ('+(c||'unknown')+'). Try again.')}

function drawPh(pre,i){const sp=$('#'+pre+'s'+i+' span'),x=$('#'+pre+'x'+i),L=PHS[pre];if(!sp)return;sp.innerHTML=L[i]?`<img src="${URL.createObjectURL(L[i])}" alt="Photo ${i+1}">`:`${ic('cam')}<b>Photo ${i+1}</b>`;x.style.display=L[i]?'flex':'none';

let AICTL=null,AIR=null;
async function aiRun(ctx){const files=PHS[ctx=='ex'?'ai':'ph'].filter(Boolean),mid=ctx=='ex'?gv('mare'):$('#fcm').value,out=$('#aiout');
if(!files.length){out.innerHTML='<p class="hint wn">Add at least one photo first.</p>';return}

const nn=v=>v==null||v===''||isNaN(+v)?null:+v;
function aiView(r,ctx){const F=Array.isArray(r.follicles)?r.follicles:[],P=r.pregnancy||{},fl=r.fluid||{},rows=[];
rows.push(['Shows',[cap(r.view),r.side&&r.side!='unknown'?cap(r.side)+' side':''].filter(Boolean).join(' · ')||'—']);
if(r.screenText)rows.push(['Screen text',r.screenText]);
rows.push(['Follicles',F.length?F.map(f=>`${f.side&&f.side!='unknown'?cap(f.side)+': ':''}${nn(f.mm)!=null?nn(f.mm)+' mm'+(f.source=='screen'?' (screen caliper)':f.source=='estimated'?' (estimated)':''):'size not measurable'}${f.notes?' · '+f.notes:''}`).join('\n'):'None seen']);
rows.push(['Corpus luteum',cap(r.cl||'unclear')]);
rows.push(['Edema',nn(r.edema)!=null?nn(r.edema)+' / 5':'Not graded']);
rows.push(['Fluid',fl.present?[nn(fl.depthMm)!=null?nn(fl.depthMm)+' mm':'Present',fl.echogenicity].filter(Boolean).join(' · '):'None seen']);
if(r.cysts)rows.push(['Cysts',r.cysts]);
if(P.vesicle)rows.push(['Pregnancy',[nn(P.diameterMm)!=null?'Vesicle '+nn(P.diameterMm)+' mm':'Vesicle seen',nn(P.estDays)!=null?'about '+nn(P.estDays)+' days':'',P.twinsSuspected?'second vesicle suspected':''].filter(Boolean).join(' · ')]);
const C=Array.isArray(r.cautions)?r.cautions.filter(Boolean):[];
return`<div class="aires"><div class="row"><b>AI reading</b>${r.quality?`<span class="ch ${r.quality=='good'?'o':r.quality=='poor'?'r':''}">${esc(cap(r.quality))} image</span>`:''}</div>
<table class="kv">${rows.map(([k,v])=>`<tr><td>${k}</td><td>${esc(v).replace(/\n/g,'<br>')}</td></tr>`).join('')}</table>
${r.summary?`<p style="margin:8px 0">${esc(r.summary)}</p>`:''}${C.length?`<ul class="rs wn">${C.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
<button type="button" class="btn w" onclick="${ctx=='ex'?'aiApply()':'aiNote()'}">${ctx=='ex'?'Fill exam from AI reading':'Add AI reading to the note'}</button><p id="aiap" class="hint ok"></p></div>`}
function aiFoll(r){const best={right:null,left:null},F=Array.isArray(r.follicles)?r.follicles:[];
F.forEach(f=>{const mm=nn(f.mm);if(mm==null)return;let sd=f.side=='left'||f.side=='right'?f.side:(r.side=='left'||r.side=='right'?r.side:null);if(!sd&&F.filter(x=>nn(x.mm)!=null).length==1)sd=null;if(sd&&(best[sd]==null||mm>best[sd]))best[sd]=mm});return best}
function aiApply(){if(!AIR)return;const b=aiFoll(AIR),done=[];
if(b.right!=null){$('#fr').value=b.right;done.push('right '+b.right+' mm')}if(b.left!=null){$('#fl').value=b.left;done.push('left '+b.left+' mm')}
const ed=nn(AIR.edema);if(ed!=null){const v=Math.max(0,Math.min(5,Math.round(ed)));$('#fedema').value=v;$('#ev').textContent=v;done.push('edema '+v)}
if(AIR.summary){const n=$('#fnote');n.value=(n.value?n.value+' · ':'')+'AI: '+AIR.summary}
$('#aiap').textContent=(done.length?'Filled '+done.join(', ')+'. ':'No measurements to fill; summary added to notes. ')+'Check before saving. Ovulation is never set by AI.'}
function aiNote(){if(!AIR)return;const b=aiFoll(AIR),t=$('#fcn'),parts=[b.right!=null?'R '+b.right+' mm':'',b.left!=null?'L '+b.left+' mm':'',nn(AIR.edema)!=null?'edema '+nn(AIR.edema)+'/5':''].filter(Boolean);
t.value=t.value.replace(/\s*$/,'')+'\nAI reading: '+(parts.length?parts.join(', ')+'. ':'')+(AIR.summary||'');$('#aiap').textContent='Added to the note.'}

const dms=t.match(/(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)(?:"|″|'')?\s*([NS])[\s,]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)(?:"|″|'')?\s*([EW])/i);
if(dms){const f=(d,m,s,h)=>(+d+ +m/60+ +s/3600)*(/[SW]/i.test(h)?-1:1),a=f(dms[1],dms[2],dms[3],dms[4]),b=f(dms[5],dms[6],dms[7],dms[8]);if(Math.abs(a)<=90&&Math.abs(b)<=180)return{lat:+a.toFixed(6),lng:+b.toFixed(6)}}
const N='(-?\\d{1,3}\\.\\d+)';
for(const p of[new RegExp('!3d'+N+'!4d'+N),new RegExp('@'+N+','+N),new RegExp('[?&](?:q|query|destination|ll|daddr)=(?:loc:)?'+N+'(?:,|%2C)\\s*'+N,'i'),new RegExp('^'+N+'\\s*[,\\s]\\s*'+N+'$')]){const m=t.match(p);if(m){const a=+m[1],b=+m[2];if(Math.abs(a)<=90&&Math.abs(b)<=180)return{lat:a,lng:b}}}
return/^https?:\/\//i.test(t)?{link:t}:{bad:1}}
const vDir=v=>hasLoc(v)?'https://www.google.com/maps/dir/?api=1&destination='+v.lat+','+v.lng+'&travelmode=driving':v.link||'';
function vRoute(L){const p=L.filter(hasLoc);if(p.length<2)return'';const z=p[p.length-1];
return'https://www.google.com/maps/dir/?api=1&destination='+z.lat+','+z.lng+'&waypoints='+encodeURIComponent(p.slice(0,-1).map(v=>v.lat+','+v.lng).join('|'))+'&travelmode=driving'}
const farmsAll=()=>[...new Set(D.visits.map(v=>(v.farm||'').trim()).concat(D.mares.map(m=>(m.owner||'').trim())).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const lastFarm=f=>D.visits.filter(v=>(v.farm||'').trim().toLowerCase()==f.trim().toLowerCase()&&(hasLoc(v)||v.link||v.phone)).sort((a,b)=>a.date<b.date?-1:1).slice(-1)[0];

function visits(a){if(/^\d{4}-\d{2}-\d{2}$/.test(a))VS=a;const d=VD(),s=ws(d),t=today(),L=vOf(d),open=L.filter(v=>!v.done),rt=vRoute(open);
const fvN=fvLegacy().length;
return`<div class="hrow"><div class="hd"><h1>Visits</h1><p class="sub">Farm and stud calls · ${dm(s)} – ${dm(addD(s,6))}</p></div><a class="btn" href="#visit-new_${d}">+ New visit</a></div>
${fvN?`<div class="al"><b>${fvN} visit${fvN>1?'s':''} found from the Field Visits page on this phone.</b><button class="btn" onclick="fvImport()">Bring them into EquiRepro</button></div>`:''}
<div class="seg"><a href="#visits-${addD(d,-7)}">‹ Previous</a><a href="#visits-${t}" class="${ws(t)==s?'on':''}">This week</a><a href="#visits-${addD(d,7)}">Next ›</a></div>
<div class="vday">${[0,1,2,3,4,5,6].map(i=>{const x=addD(s,i),n=vOf(x);return`<a href="#visits-${x}" class="${x==d?'on':''}${x==t?' td':''}"><span>${DN[i]}</span><b>${+x.slice(8)}</b><span class="vdots">${n.slice(0,4).map(v=>`<i class="${v.done?'d':''}"></i>`).join('')}</span></a>`}).join('')}</div>
<div class="row"><h2>${d==t?'Today':DN[dow(d)]+' '+dm(d)}</h2><span class="mu sm">${L.length?L.length+' visit'+(L.length>1?'s':'')+(open.length<L.length?' · '+open.length+' left':''):''}</span></div>
${L.length?`<div class="btns3" style="grid-template-columns:repeat(${rt?3:2},1fr)">${rt?`<a class="btn" href="${rt}" target="_blank" rel="noopener">Day route</a>`:''}<button class="btn o" id="nearBtn" onclick="vNearest()">Nearest first</button><button class="btn o" onclick="vShare()">Share day</button></div><p id="vmsg" class="hint ok"></p>`:''}

${L.map(vCard).join('')||`<div class="card mu" style="text-align:center">No visits on this day.<br>Tap <b>+ New visit</b> to add a farm, its GPS location and the mares to see.</div>`}
<p class="hint">Visits also show in your Week and on Home. Mares linked to a file open her page and the Exam form in one tap.</p>`}
function vCard(v){const ms=vMares(v),dir=vDir(v);
return`<div class="vis${v.done?' dn':''}"><span class="tm">${esc(v.time||'--:--')}</span><div class="card" style="margin:6px 0">
<div class="row"><span class="vf">${esc(v.farm||'Unnamed farm')}</span><span class="ch">${esc(v.purpose||'Visit')}</span></div>
${ms.map(m=>{const f=m.id&&D.mares.some(x=>x.id==m.id);return`<div class="vm">${f?`<a class="lnk" href="#mare-${esc(m.id)}">${esc(vName(m))}</a>`:`<b>${esc(vName(m))}</b>`}${m.target?`<span class="tg">${esc(m.target)}</span>`:''}${f?`<a class="lnk ex" href="#exam-${esc(m.id)}">Exam ›</a>`:''}</div>`}).join('')}
<div class="mu sm" style="margin-top:8px">${hasLoc(v)?'📍 '+(+v.lat).toFixed(5)+', '+(+v.lng).toFixed(5):v.link?'📍 Maps link saved':'No location yet'}${v.phone?' · ☎ '+esc(v.phone):''}</div>
${v.notes?`<div class="sm" style="margin-top:4px;white-space:pre-wrap">${esc(v.notes)}</div>`:''}
<div class="vacts">${dir?`<a class="btn" href="${esc(dir)}" target="_blank" rel="noopener">Directions</a>`:''}${v.phone?`<a class="btn o" href="tel:${esc(v.phone.replace(/[^\d+]/g,''))}">Call</a>`:''}<button class="btn o" onclick="vDone(${v.id})">${v.done?'Undo':'Done'}</button><a class="btn o" href="#visit-${v.id}">Edit</a><button class="x" style="margin-left:auto" onclick="del('visits',${v.id},this)">✕</button></div></div></div>`}

/* form */
const mrRow=(n,t)=>`<div class="mr"><input class="mrn" list="mrList" placeholder="Mare name" value="${esc(n||'')}" autocomplete="off"><input class="mrt" list="tgList" placeholder="Target" value="${esc(t||'')}" autocomplete="off"><button type="button" class="x" aria-label="Remove mare" onclick="this.parentNode.remove()">✕</button></div>`;

if(!v)return hdr('Visit','Not found',['#visits','Visits']);
const loc=hasLoc(v)?(+v.lat).toFixed(6)+', '+(+v.lng).toFixed(6):(v.link||''),ms=vMares(v);

${sec('Farm &amp; time',`<label>Farm / stud<input id="fvfarm" list="farmList" value="${esc(v.farm||'')}" autocomplete="off" onchange="vFarm()"></label><div id="vsug"></div><div class="grid2"><label>Date<input id="fvdate" type="date" value="${esc(v.date)}"></label><label>Time<input id="fvtime" type="time" value="${esc(v.time||'')}"></label></div><label>Purpose<select id="fvpur">${VPUR.map(p=>`<option${p==v.purpose?' selected':''}>${p}</option>`).join('')}</select></label>`)}
${sec('GPS location',IN_ART?`<button type="button" class="btn w" style="margin:6px 0" onclick="vMapsHere()">📍 Get my location from Google Maps</button><ol class="rs" style="font-size:13px;margin-bottom:8px"><li>In Maps, tap the <b>blue dot</b> (or long-press where you are)</li><li>Tap the coordinates shown at the top to <b>copy</b> them</li><li>Come back here and tap <b>Paste</b></li></ol><label>Coordinates or Google Maps link<div class="pr" style="grid-template-columns:1fr auto;margin-top:4px"><input id="fvloc" value="${esc(loc)}" oninput="vLocHint()" autocomplete="off" inputmode="url"><button type="button" class="btn o" style="margin:0" onclick="vPaste()">Paste</button></div></label><p class="hint" id="vlh"></p>`:`<button type="button" class="btn w" style="margin:6px 0" id="gpsBtn" onclick="vGps()">📍 Use my current location</button><label>Or paste coordinates / Google Maps link<div class="pr" style="grid-template-columns:1fr auto;margin-top:4px"><input id="fvloc" value="${esc(loc)}" oninput="vLocHint()" autocomplete="off" inputmode="url"><button type="button" class="btn o" style="margin:0" onclick="vPaste()">Paste</button></div></label><p class="hint" id="vlh"></p>`)}
${sec('Mares and target',`<div id="mrs">${(ms.length?ms:[{}]).map(m=>mrRow(m.id&&D.mares.some(x=>x.id==m.id)?mLabel(M(m.id)):m.name,m.target)).join('')}</div><button type="button" class="btn o" onclick="$('#mrs').insertAdjacentHTML('beforeend',mrRow())">+ Add mare</button><p class="hint">Pick a mare file from the list to link her, or type any name.</p>`)}

${sbtn('Save visit',`vSave('${isNew?'':v.id}')`)}<p id="msg" class="sm wn"></p>`}
function vLocHint(){const e=$('#vlh');if(!e)return;const r=parseLoc(gv('vloc'));
e.className='hint '+(r.lat!=null?'loc-ok':r.bad?'loc-bad':'');
e.textContent=r.lat!=null?'✓ Location: '+r.lat.toFixed(6)+', '+r.lng.toFixed(6):r.link?'Short link kept as-is. Use coordinates to include this farm in the day route and Nearest first.':r.bad?'Could not read a location. Use 24.713600, 46.675300 or a full Google Maps link.':'At the farm, tap the button. Or long-press the farm in Google Maps and paste the coordinates.'}
let VFL='';
function vFarm(){const f=gv('vfarm').trim();if(!f||f==VFL)return;VFL=f;const p=lastFarm(f);
if(p){if(!gv('vloc').trim())$('#fvloc').value=hasLoc(p)?(+p.lat).toFixed(6)+', '+(+p.lng).toFixed(6):(p.link||'');if(!gv('vph').trim())$('#fvph').value=p.phone||'';vLocHint()}
const have=[...document.querySelectorAll('.mrn')].map(i=>i.value.trim().toLowerCase()),own=D.mares.filter(m=>(m.owner||'').trim().toLowerCase()==f.toLowerCase()&&!have.includes(mLabel(m).toLowerCase()));
$('#vsug').innerHTML=own.length?`<p class="hint">Mare files at ${esc(f)}, tap to add:</p><div class="chips">${own.map(m=>`<button type="button" class="ch" onclick="vAddM('${esc(m.id)}',this)">+ ${esc(m.name)}</button>`).join('')}</div>`:''}
function vAddM(id,b){const lab=mLabel(M(id)),em=[...document.querySelectorAll('.mrn')].find(i=>!i.value.trim());if(em)em.value=lab;else $('#mrs').insertAdjacentHTML('beforeend',mrRow(lab,''));b.remove()}
function vMapsHere(){window.open('https://www.google.com/maps','_blank');const e=$('#vlh');if(e){e.className='hint';e.textContent='Google Maps opened. Copy the coordinates there, then tap Paste.'}}
async function vPaste(){const i=$('#fvloc'),e=$('#vlh');try{const t=(await navigator.clipboard.readText()).trim();if(t){i.value=t;vLocHint();return}}catch(x){}
i.focus();i.select();if(e){e.className='hint';e.textContent='Long-press the box above and choose Paste.'}}
function vGps(){const b=$('#gpsBtn');if(!navigator.geolocation){$('#vlh').textContent='This browser cannot read GPS here. Paste the coordinates instead.';return}
b.disabled=true;b.textContent='Getting location…';
navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;b.textContent='📍 Use my current location';$('#fvloc').value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);vLocHint();$('#vlh').textContent+=' (±'+Math.round(p.coords.accuracy)+' m)'},
e=>{b.disabled=false;b.textContent='📍 Use my current location';$('#vlh').className='hint loc-bad';$('#vlh').textContent=e.code==1?(IN_ART?'GPS is not available inside claude.ai. Use the EquiRepro file in Chrome on your phone, or paste the coordinates.':'Location is blocked. Allow it for this page in Chrome\'s site settings.'):'No GPS fix. Turn on Location and try again.'},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function vMatch(txt){const t=txt.trim();if(!t)return null;const p=t.match(/\(([^()]+)\)\s*$/);if(p&&D.mares.some(m=>m.id==p[1].trim()))return{id:p[1].trim(),name:M(p[1].trim()).name};
const same=D.mares.filter(m=>m.name.toLowerCase()==t.toLowerCase()||m.id.toLowerCase()==t.toLowerCase());return same.length==1?{id:same[0].id,name:same[0].name}:{name:t}}
function vSave(id){const farm=gv('vfarm').trim(),date=gv('vdate');if(!farm||!date){$('#msg').textContent='Farm and date are required.';return}
const r=parseLoc(gv('vloc'));if(r.bad){$('#msg').textContent='Fix the location or clear it.';return}
const mares=[...document.querySelectorAll('.mr')].map(row=>{const m=vMatch(row.querySelector('.mrn').value)||{},t=row.querySelector('.mrt').value.trim();return m.name||t?{...m,target:t}:null}).filter(Boolean);
const old=id?D.visits.find(x=>x.id==id):null,v={id:old?old.id:Date.now(),farm,date,time:gv('vtime'),purpose:gv('vpur'),lat:r.lat??null,lng:r.lng??null,link:r.link||'',phone:gv('vph').trim(),notes:gv('vnote').trim(),mares,done:old?!!old.done:false};
if(old)Object.assign(old,v);else D.visits.push(v);save();VS=date;location.hash='visits-'+date}

/* nearest first: nearest-neighbour from current position, then 2-opt; time slots are kept */
const kmD=(a,b)=>{const R=6371,r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const pLen=(s,L)=>{let d=0,p=s;L.forEach(v=>{if(p)d+=kmD(p,v);p=v});return d};
function nnOrder(s,L){const left=L.map(v=>({...v,lat:+v.lat,lng:+v.lng})),o=[];let c=s||left[0];while(left.length){let bi=0,bd=1e9;left.forEach((v,i)=>{const d=kmD(c,v);if(d<bd){bd=d;bi=i}});c=left.splice(bi,1)[0];o.push(c)}
for(let g=0,imp=true;imp&&g<50;g++){imp=false;for(let i=0;i<o.length-1;i++)for(let j=i+1;j<o.length;j++){const c2=[...o.slice(0,i),...o.slice(i,j+1).reverse(),...o.slice(j+1)];if(pLen(s,c2)+1e-9<pLen(s,o)){o.splice(0,o.length,...c2);imp=true}}}return o}
const vPos=()=>new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})});
async function vNearest(){const open=vOf(VD()).filter(v=>!v.done),wl=open.filter(hasLoc),nl=open.filter(v=>!hasLoc(v));
if(wl.length<2){$('#vmsg').textContent='Add GPS locations to at least 2 open visits on this day first.';return}
const b=$('#nearBtn');b.disabled=true;b.textContent='Locating…';const here=await vPos();b.disabled=false;b.textContent='Nearest first';
const o=nnOrder(here,wl),full=[...o,...nl],slots=open.map(v=>v.time).filter(Boolean).sort(),times=full.map((v,i)=>slots[i]||v.time||'');VORD={ids:full.map(v=>v.id),times};
const bef=pLen(here,wl.map(v=>({lat:+v.lat,lng:+v.lng}))),aft=pLen(here,o);let prev=here;
$('#vord').innerHTML=`<div class="card ord"><div class="ttl">Nearest-first order</div><div class="mu sm">${here?'Starting from where you are now.':'Your location was not available, so it starts from the first farm.'}</div><ol>${full.map((v,i)=>{let k;if(!hasLoc(v))k='no location, kept last';else{k=prev?kmD(prev,v).toFixed(1)+' km':'start';prev=v}return`<li><b class="wn">${esc(times[i]||'--:--')}</b> ${esc(v.farm)} <span class="mu sm">· ${k}</span></li>`}).join('')}</ol>
<p class="sm">Total ≈ ${aft.toFixed(1)} km${bef-aft>.05?' · saves ≈ '+(bef-aft).toFixed(1)+' km':' · the current order is already the shortest'}. Straight-line distance; roads are longer. Your time slots stay the same and the farms move into them.</p>
<div class="grid2"><button class="btn" style="margin:0" onclick="vApply()">Apply this order</button><button class="btn o" style="margin:0" onclick="VORD=null;$('#vord').innerHTML=''">Cancel</button></div></div>`}
function vApply(){if(!VORD)return;VORD.ids.forEach((id,i)=>{const v=D.visits.find(x=>x.id==id);if(v&&VORD.times[i])v.time=VORD.times[i]});VORD=null;save();route()}
async function vShare(){const d=VD(),L=vOf(d);let s=(D.s.clinic?D.s.clinic+'\n':'')+'Visits · '+DN[dow(d)]+' '+dm(d)+'\n';
L.forEach(v=>{s+='\n'+(v.time||'--:--')+'  '+v.farm+(v.purpose?' ('+v.purpose+')':'')+(v.done?' ✓':'')+'\n';vMares(v).forEach(m=>{s+='   • '+vName(m)+(m.target?' → '+m.target:'')+'\n'});if(hasLoc(v))s+='   📍 https://maps.google.com/?q='+v.lat+','+v.lng+'\n';else if(v.link)s+='   📍 '+v.link+'\n'});
const r=vRoute(L.filter(v=>!v.done));if(r)s+='\nFull route: '+r;s=s.trim();
if(IN_ART){await copyText(s,'#vmsg');return}try{if(navigator.share){await navigator.share({text:s});return}}catch(e){if(e.name=='AbortError')return}window.open('https://wa.me/?text='+encodeURIComponent(s),'_blank')}

/* bring in visits saved by the separate Field Visits page on this phone */
function fvLegacy(){if(IN_ART)return[];let L=[];try{L=JSON.parse(localStorage.getItem('fv_visits')||'[]')}catch(e){}if(!Array.isArray(L))return[];const have=new Set(D.visits.map(v=>v.fv).filter(Boolean));return L.filter(v=>v&&v.id&&v.date&&!v.example&&!have.has(v.id))}
function fvImport(){const L=fvLegacy();L.forEach((v,i)=>D.visits.push({id:Date.now()+i,fv:v.id,farm:v.farm||'',date:v.date,time:v.time||'',purpose:v.purpose||'Other',lat:v.lat??null,lng:v.lng??null,link:v.link||'',phone:v.phone||'',notes:v.notes||'',done:!!v.done,
mares:(Array.isArray(v.mares)?v.mares:[]).map(m=>({...(vMatch(m.name||'')||{name:m.name||''}),target:m.target||''}))}));save();route()}

/* mare report */

const ex=EX(id).filter(e=>inR(e.date)),ai=D.ais.filter(a=>a.mare==id&&inR(a.date)).sort((a,b)=>a.date<b.date?-1:1),

/* work log */
function repWork(){const to=RP.to||today(),from=RP.from||(D.exams.concat(D.ais).map(x=>x.date).sort()[0]||today()),days=[];
for(let d=from,g=0;d<=to&&g<400;d=addD(d,1),g++)days.push(d);
const ex=D.exams.filter(e=>inR(e.date)),ai=D.ais.filter(a=>inR(a.date)),tr=D.et.filter(t=>inR(t.date)),chk=[];
D.ais.forEach(a=>[1,2].forEach(k=>{const d=addD(a.date,D.s['c'+k]);if(inR(d))chk.push({d,m:a.mare,r:a['c'+k],l:'Pregnancy check '+k+(a.stallion?' ('+a.stallion+')':'')})}));
D.et.forEach(t=>[1,2].forEach(k=>{const d=etDue(t,k);if(inR(d))chk.push({d,m:t.rec,r:t['c'+k],l:'ET pregnancy check '+k})}));
const done=chk.filter(c=>c.r!='Pending'),due=chk.filter(c=>c.r=='Pending').sort((a,b)=>a.d<b.d?-1:1),seen=new Set([...ex.map(e=>e.mare),...ai.map(a=>a.mare),...tr.map(t=>t.rec)]);
let body='';const tl=[];
days.forEach(day=>{const rows=[];
 ex.filter(e=>e.date==day).forEach(e=>rows.push([e.time,e.mare,'Exam','R '+ovx(e,'r')+' / L '+ovx(e,'l')+' · edema '+e.edema+(e.es?' · '+e.es+' estrus':'')+(e.ov?' · ovulated':'')+(e.ind&&e.ind!='None'?' · '+e.ind:'')+(e.sw?' · '+swTxt(e):'')+(e.note&&e.note!='Example row'?' · '+e.note:''),'']));
 ai.filter(a=>a.date==day).forEach(a=>rows.push([a.time,a.mare,'Insemination',(a.stallion||'')+' · '+a.type+(a.dose?' · '+a.dose+' M':''),'']));
 tr.filter(t=>t.date==day).forEach(t=>rows.push([t.time,t.rec,'Embryo transfer','from '+M(t.donor).name+' · day '+t.eday+' '+t.stage+' G'+t.grade,'']));
 done.filter(c=>c.d==day).forEach(c=>rows.push(['',c.m,c.l,'',c.r]));
 D.visits.filter(v=>v.date==day).forEach(v=>rows.push([v.time,null,'Farm visit · '+(v.purpose||''),vMares(v).map(m=>vName(m)+(m.target?' → '+m.target:'')).join(', ')+(v.done?'':' (not marked done)'),'',v.farm]));
 if(!rows.length)return;rows.sort((a,b)=>(a[0]||'99')<(b[0]||'99')?-1:1);tl.push(DN[dow(day)]+' '+dm(day)+': '+rows.length+' task'+(rows.length>1?'s':''));
 body+=`<div class="rp-day">${DN[dow(day)]} ${fd(day)}</div>`+tbl(['Time','Mare','Owner','Work','Details'],rows.map(r=>[esc(r[0]||'—'),r[1]?esc(M(r[1]).name):'—',esc(r[1]?M(r[1]).owner||'':r[5]||''),esc(r[2]),r[4]?rc(r[4]):esc(r[3])]))});
const pg=done.filter(c=>c.r=='Pregnant').length;
const html=rHead('Work log','Exams, inseminations, transfers and pregnancy checks')

/* season summary */
function aiCycles(list){const by={};list.slice().sort((a,b)=>a.mare==b.mare?(a.date<b.date?-1:1):(a.mare<b.mare?-1:1)).forEach(a=>{const c=by[a.mare]=by[a.mare]||[],l=c[c.length-1];if(l&&dd(l.last,a.date)<=7){l.ais.push(a);l.last=a.date}else c.push({mare:a.mare,ais:[a],last:a.date})});
return Object.values(by).flat().map(c=>{const rs=c.ais.map(res),a=c.ais[c.ais.length-1];return{mare:c.mare,st:a.stallion||'Not recorded',ty:a.type,own:M(c.mare).owner||'Not recorded',r:rs.includes('Pregnant')?'Pregnant':rs.includes('Open')?'Open':'Pending'}})}
function grp(L,key){const g={};L.forEach(c=>{const k=String(key(c)??'—'),o=g[k]=g[k]||{k,n:0,p:0,o:0,q:0,m:new Set()};o.n++;o.m.add(c.mare);c.r=='Pregnant'?o.p++:c.r=='Open'?o.o++:o.q++});return Object.values(g).sort((a,b)=>b.n-a.n||(a.k<b.k?-1:1))}
const gRows=G=>G.map(o=>[esc(o.k),o.m.size,o.n,o.p,o.o,o.q,'<b>'+pct(o.p,o.p+o.o)+'</b>']);
const gHead=(f,m,n)=>[f,'#'+m,'#'+n,'#Preg.','#Open','#Pend.','#Rate'];
function repSeason(){const cy=aiCycles(D.ais.filter(a=>inR(a.date))),T=grp(cy,()=>'All')[0]||{n:0,p:0,o:0,q:0,m:new Set()};
const et=D.et.filter(t=>inR(t.date)).map(t=>({mare:t.rec,r:res(t),g:'Grade '+t.grade,d:'Day '+t.eday,don:M(t.donor).name,st:t.stage})),E=grp(et,()=>'All')[0]||{n:0,p:0,o:0,q:0};
const L=D.bill.filter(b=>inR(b.date)),bt=tot(L),bp=tot(L.filter(b=>b.paid)),own={};
L.forEach(b=>{const k=M(b.mare).owner||'Not recorded',o=own[k]=own[k]||{k,t:0,p:0};o.t+=b.qty*b.price;if(b.paid)o.p+=b.qty*b.price});
const st=grp(cy,c=>c.st);
const html=rHead('Season summary','Breeding results and income')
+kpi([['Mares bred',T.m.size],['Cycles',T.n],['Pregnancy rate',pct(T.p,T.p+T.o)],['Transfers',E.n],['ET pregnancy',pct(E.p,E.p+E.o)],['Billed',fm(bt)]])
+'<h3>Per stallion</h3>'+tbl(gHead('Stallion','Mares','Cycles'),gRows(st),'No inseminations in this period.')
+(cy.length?'<h3>Per semen type</h3>'+tbl(gHead('Semen','Mares','Cycles'),gRows(grp(cy,c=>c.ty)))+'<h3>Per owner</h3>'+tbl(gHead('Owner','Mares','Cycles'),gRows(grp(cy,c=>c.own))):'')
+'<h3>Embryo transfer</h3>'+(et.length?tbl(gHead('Grade','Rec.','ET'),gRows(grp(et,t=>t.g)))+tbl(gHead('Embryo day','Rec.','ET'),gRows(grp(et,t=>t.d)))+tbl(gHead('Donor','Rec.','ET'),gRows(grp(et,t=>t.don))):'<p class="mu sm">No transfers in this period.</p>')
+'<h3>Income</h3>'+(L.length?tbl(['Owner','#Billed','#Paid','#Outstanding'],Object.values(own).sort((a,b)=>b.t-a.t).map(o=>[esc(o.k),fm(o.t),fm(o.p),fm(o.t-o.p)]))+`<div class="tots"><div class="row"><span>Billed</span><b>${fm(bt)}</b></div><div class="row"><span>Paid</span><span>${fm(bp)}</span></div><div class="row big2"><span>Outstanding</span><b>${fm(bt-bp)}</b></div></div>`:'<p class="mu sm">No bill items in this period.</p>')
+'<p class="mu sm" style="margin-top:14px">Rate = pregnant ÷ (pregnant + open); pending results are left out. A cycle is one mare\'s inseminations within 7 days of each other, counted pregnant if any check in that cycle is positive. Final result per insemination uses check 2 when recorded, else check 1.</p>'
+rFoot();
const text=[(D.s.clinic?D.s.clinic+'\n':'')+'Season summary · '+perTxt(),'','Mares bred: '+T.m.size+' · cycles: '+T.n+' · pregnant: '+T.p+' · open: '+T.o+' · pending: '+T.q,'Pregnancy rate per cycle: '+pct(T.p,T.p+T.o),
...(st.length?['','Per stallion:',...st.map(o=>'• '+o.k+': '+o.p+'/'+(o.p+o.o)+' pregnant ('+pct(o.p,o.p+o.o)+')'+(o.q?', '+o.q+' pending':''))]:[]),
...(E.n?['','Embryo transfers: '+E.n+' · pregnant: '+E.p+' ('+pct(E.p,E.p+E.o)+')']:[]),
...(L.length?['','Billed '+fmN(bt)+' · paid '+fmN(bp)+' · outstanding '+fmN(bt-bp)]:[])].join('\n');
return{html,text,name:'EquiRepro-season-'+(RP.from||'start')+'-'+(RP.to||today())}}

const KINDS=['mares','exams','ais','ev','bill','et','rscr','rchk','visits','semen','media'];
const canWrite=k=>!!ME&&(ME.role=='admin'||(ME.role=='accountant'&&(k=='bill'||k=='prices')));
function midsOf(k,x){if(k=='mares')return[String(x.id)];if(k=='semen')return['semen:'+x.id];if(k=='media')return[x.kind=='semen'?'semen:'+x.ref:String(x.ref)];
 if(k=='et')return[x.donor,x.rec].filter(Boolean).map(String);if(k=='visits')return(x.mares||[]).map(m=>m.id).filter(Boolean).map(String);return x.mare?[String(x.mare)]:[]}
function setRows(){const{prices,cur,...rest}=D.s;return{'settings|s':{kind:'settings',id:'s',data:rest},'prices|p':{kind:'prices',id:'p',data:{prices,cur}}}}
function localRows(){const o=setRows();KINDS.forEach(k=>(D[k]||[]).forEach(x=>{o[k+'|'+x.id]={kind:k,id:String(x.id),data:x}}));return o}
function localJ(kind,id){if(kind=='settings'||kind=='prices'){const r=setRows()[kind+'|'+id];return r?cj(r.data):undefined}
 const x=(D[kind]||[]).find(y=>String(y.id)==id);return x?cj(x):undefined}
function pendList(){const L=localRows(),up=[],del=[];
 for(const key in L){const r=L[key];if(!canWrite(r.kind))continue;const j=cj(r.data);if(SRV.snap[key]!==j)up.push({key,j,row:{kind:r.kind,id:r.id,data:r.data,mare_ids:midsOf(r.kind,r.data),deleted:false}})}
 for(const key in SRV.snap){if(L[key])continue;const i=key.indexOf('|'),kind=key.slice(0,i),id=key.slice(i+1);if(!canWrite(kind))continue;let old={};try{old=JSON.parse(SRV.snap[key])}catch(e){}
  del.push({key,row:{kind,id,data:old,mare_ids:midsOf(kind,old),deleted:true}})}
 return up.concat(del)}
const cacheK=()=>'equirepro-srv-'+ME.uid;
function cacheSave(){if(!ME||!ME.uid)return;try{localStorage.setItem(cacheK(),JSON.stringify({D,snap:SRV.snap,since:SRV.since,me:ME}))}catch(e){}}
let PUSHT=0,PUSHING=false,PAGAIN=false;
function srvQueue(){if(SRV.state!='ready')return;cacheSave();clearTimeout(PUSHT);PUSHT=setTimeout(srvPush,800)}
async function srvPush(){if(SRV.state!='ready'||!SB||!SRV.loaded)return;if(PUSHING){PAGAIN=true;return}PUSHING=true;
 try{const all=pendList();
  for(let i=0;i<all.length;i+=200){const part=all.slice(i,i+200),{error}=await SB.from('records').upsert(part.map(x=>x.row),{onConflict:'kind,id'});if(error)throw error;
   part.forEach(x=>{if(x.row.deleted)delete SRV.snap[x.key];else SRV.snap[x.key]=x.j})}
  SRV.err=''}
 catch(e){SRV.err=(e&&e.message)||'no connection';clearTimeout(PUSHT);PUSHT=setTimeout(srvPush,15000)}
 finally{PUSHING=false;cacheSave();updSync();if(PAGAIN){PAGAIN=false;srvPush()}}}
function applyRow(r,seen){const key=r.kind+'|'+r.id,j=cj(r.data),lj=localJ(r.kind,r.id),pend=SRV.loaded&&lj!==undefined&&lj!==SRV.snap[key];
 if(!r.deleted&&seen)seen.add(key);if(pend)return false;
 if(r.kind=='settings'){const{prices,cur,...rest}=r.data||{};D.s={...D.s,...rest};SRV.snap[key]=j;return true}
 if(r.kind=='prices'){if(Array.isArray(r.data.prices))D.s.prices=r.data.prices;if(r.data.cur)D.s.cur=r.data.cur;SRV.snap[key]=j;return true}
 if(!KINDS.includes(r.kind))return false;const L=D[r.kind]=D[r.kind]||[],i=L.findIndex(x=>String(x.id)==r.id);
 if(r.deleted){if(i>=0)L.splice(i,1);delete SRV.snap[key];return i>=0}
 if(i>=0){if(lj===j){SRV.snap[key]=j;return false}L[i]=r.data}else L.push(r.data);SRV.snap[key]=j;return true}
let PULLING=false;
async function srvPull(full){if(!SB||SRV.state!='ready'||PULLING)return;PULLING=true;
 try{const t0=full?EPOCH:new Date(Math.max(0,(Date.parse(SRV.since)||0)-120000)).toISOString(),seen=full?new Set():null;let from=0,max=full?EPOCH:SRV.since,ch=false;
  for(;;){const{data,error}=await SB.from('records').select('kind,id,data,deleted,updated_at').gt('updated_at',t0).order('updated_at').order('kind').order('id').range(from,from+999);if(error)throw error;
   data.forEach(r=>{if(Date.parse(r.updated_at)>Date.parse(max))max=r.updated_at;if(applyRow(r,seen))ch=true});if(data.length<1000)break;from+=1000}
  if(full)KINDS.forEach(k=>{const L=D[k]||[];D[k]=L.filter(x=>{const key=k+'|'+x.id;if(seen.has(key))return true;if(SRV.loaded&&cj(x)!==SRV.snap[key]&&canWrite(k))return true;delete SRV.snap[key];ch=true;return false})});
  SRV.since=max;SRV.loaded=true;SRV.err='';SRV.at=lt(Date.now())[1];if(ch){D=norm(D);softRoute()}cacheSave()}
 catch(e){SRV.err=(e&&e.message)||'no connection'}
 finally{PULLING=false;updSync()}}
function srvText(){if(SRV.err)return'Not on the server yet ('+SRV.err+'). Kept on this phone, retrying.';const n=SRV.loaded?pendList().length:0;
 return n?'Saving '+n+' change'+(n>1?'s':'')+'…':'All changes are on the clinic server'+(SRV.at?' · checked '+SRV.at:'')+'.'}
async function srvBoot(){if(!CFG){SRV.state='nocfg';route();return}if(!window.supabase){SRV.state='nolib';route();return}
 SB=supabase.createClient(CFG.u,CFG.k,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'equirepro-auth'}});
 const{data}=await SB.auth.getSession();if(!data||!data.session){SRV.state='login';route();return}await srvStart(data.session.user)}
async function srvStart(user){let c=null;try{c=JSON.parse(localStorage.getItem('equirepro-srv-'+user.id)||'null')}catch(e){}
 ME={uid:user.id,...((c&&c.me)||{})};const p=await SB.from('profiles').select('username,display_name,role').eq('user_id',user.id).maybeSingle();
 if(p.data)Object.assign(ME,p.data);else if(!p.error)ME.role='none';
 if(!ME.role||ME.role=='none'){if(!p.error)try{localStorage.removeItem('equirepro-srv-'+user.id)}catch(e){}SRV.state=p.error?'offline':'noaccess';route();return}
 const own=ME.role=='owner'||ME.role=='buyer';
 D=norm(c&&c.D?c.D:{mares:[]});SRV.snap=(c&&c.snap)||{};SRV.since=(c&&c.since)||EPOCH;SRV.loaded=!!(c&&c.D)&&!own;
 SRV.state='ready';location.hash=location.hash.slice(1)=='firstadmin'?'':location.hash;route();
 await srvPull(own||!SRV.loaded);srvPush();
 if(!SRVT){SRVT=setInterval(()=>{if(document.visibilityState=='visible'){srvPull();srvPush()}},20000);
  addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')srvPull()});addEventListener('online',()=>{srvPull();srvPush()})}}

async function logout(b){if(SRV.loaded&&pendList().length&&!LOGOUT){LOGOUT=1;$('#amsg').textContent='Some changes are not on the server yet. Tap Sign out again to sign out anyway.';return}
 LOGOUT=0;try{localStorage.removeItem(cacheK())}catch(e){}await SB.auth.signOut().catch(()=>{});ME=null;D=norm({mares:[]});SRV.snap={};SRV.since=EPOCH;SRV.loaded=false;SRV.state='login';UL=null;history.replaceState(null,'',location.pathname);route()}

${D.mares.map(m=>{const e=last(m.id),[s,c]=st(m.id),v=D.media.filter(x=>x.kind=='mare'&&x.ref==m.id).length;return`<a class="card" href="#mare-${esc(m.id)}"><div><b>${esc(m.name)}</b> <span class="mu sm">${esc(m.breed||'')}</span><div class="mu sm">${e?'Last exam '+dm(e.date)+(big(e)?' · '+big(e)+' mm':''):'No exams yet'}${v?' · '+v+' video'+(v>1?'s':''):''}</div></div><span class="ch ${c}">${s}</span></a>`}).join('')||'<div class="card mu">No mare files are linked to your login yet. Ask the clinic.</div>'}

 return`<div class="hd"><h1>EquiRepro</h1><p class="sub">${DN[dow(t)]} ${dm(t)}/${t.slice(0,4)} · ${RN[ME.role]}${D.s.clinic?' · '+esc(D.s.clinic):''}</p></div>
<div class="tiles2"><a class="tl p" href="#bills">${ic('bills')}<b style="font-size:20px">${fm(due)}</b><span>Outstanding</span></a>${acc?`<a class="tl" href="#files">${ic('mares')}<b>${D.mares.length}</b><span>Files</span></a>`:`<a class="tl" href="#reports-season">${ic('rep')}<span>Season summary</span></a>`}</div>
