/* ---------- VIDEOS & PHOTOS (private storage) ---------- */
const SURL={};
const mediaOf=(kind,ref)=>D.media.filter(x=>x.kind==kind&&x.ref==ref).sort((a,b)=>a.date==b.date?b.id-a.id:(a.date<b.date?1:-1));
const mbytes=()=>D.media.reduce((s,x)=>s+(+x.size||0),0);
function mediaBox(kind,ref){const L=mediaOf(kind,ref),adm=isAdm(),id=esc(ref);let h='',d0='';
 L.forEach(x=>{if(x.date!=d0){d0=x.date;h+=`<div class="rp-day">${DN[dow(x.date)]} ${dm(x.date)}/${x.date.slice(0,4)}</div>`}
  h+=`<div class="card media">${x.type=='photo'?`<img data-mp="${esc(x.path)}" alt="Photo ${dm(x.date)}">`:`<video data-mp="${esc(x.path)}" controls playsinline preload="metadata"></video>`}${x.note?`<div style="white-space:pre-wrap">${esc(x.note)}</div>`:''}${adm?`<div class="row mu sm"><span>${esc(x.name||'')} · ${(x.size/1048576).toFixed(1)} MB</span><button class="x" onclick="delMedia(${x.id},this)">✕</button></div>`:''}</div>`});
 return(adm?`<div class="card ed"><div class="grid2"><label>Date<input id="fmdate" type="date" value="${today()}"></label><label>Note (seen by ${kind=='semen'?'the buyer':'the owner'})<input id="fmnote" placeholder="${kind=='semen'?'e.g. motility 70%, 12 straws':'e.g. 35 mm follicle, right ovary'}"></label></div>
<div class="grid2"><label class="btn" style="margin:6px 0 0;text-align:center">${ic('video')} Record video<input type="file" accept="video/*" capture="environment" hidden onchange="upMedia('${kind}','${id}',this)"></label><label class="btn o" style="margin:6px 0 0;text-align:center">Choose videos/photos<input type="file" accept="video/*,image/*" multiple hidden onchange="upMedia('${kind}','${id}',this)"></label></div>
<p id="upmsg" class="hint">Up to 50 MB per file. Stored privately: only the clinic and ${kind=='semen'?'this buyer':'this mare\'s owner'} can watch. Server storage used: ${(mbytes()/1048576).toFixed(0)} MB.</p></div>`:'')+(h||`<p class="mu sm">No videos yet.</p>`)}
async function upMedia(kind,ref,inp){const fs=[...inp.files];inp.value='';if(!fs.length)return;const msg=$('#upmsg'),date=gv('mdate')||today(),note=gv('mnote').trim();let ok=0;
 for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>50*1048576){msg.innerHTML=`<span class="wn">${esc(f.name)} is ${(f.size/1048576).toFixed(0)} MB; the limit is 50 MB. Trim or record a shorter clip.</span>`;continue}
  msg.textContent='Uploading '+(i+1)+' of '+fs.length+' ('+(f.size/1048576).toFixed(1)+' MB)… keep this page open.';
  const path=kind+'/'+ref+'/'+Date.now()+'-'+(f.name||'clip').replace(/[^\w.\-]+/g,'_').slice(-60);
  const{error}=await SB.storage.from('media').upload(path,f,{contentType:f.type||'video/mp4',upsert:false});
  if(error){msg.innerHTML=`<span class="wn">Upload failed: ${esc(error.message)}</span>`;return}
  D.media.push({id:Date.now()+i,kind,ref,path,date,note,type:/^image\//.test(f.type)?'photo':'video',size:f.size,name:f.name||''});ok++;save()}
 if(ok)route()}
async function delMedia(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Delete?';return}const x=D.media.find(m=>m.id==id);if(!x)return;
 const{error}=await SB.storage.from('media').remove([x.path]);if(error){b.textContent='Failed';return}D.media=D.media.filter(m=>m.id!=id);save();route()}
async function fillMedia(){const els=[...document.querySelectorAll('[data-mp]')];if(!els.length||!SB)return;const now=Date.now(),need=[...new Set(els.map(e=>e.dataset.mp).filter(p=>!SURL[p]||SURL[p].x<now))];
 if(need.length){const{data}=await SB.storage.from('media').createSignedUrls(need,3600);(data||[]).forEach(r=>{if(r.signedUrl)SURL[r.path]={u:r.signedUrl,x:now+3300e3}})}
 els.forEach(e=>{const s=SURL[e.dataset.mp];if(s&&e.src!=s.u)e.src=s.u;else if(!s)e.insertAdjacentHTML('afterend','<p class="hint wn">Not available.</p>')})}

/* ---------- SEMEN FILES (for semen buyers) ---------- */
const SST=['Ordered','Collected','Processed','Shipped','Delivered','Cancelled'];
const sOf=id=>D.semen.find(s=>s.id==id);
function sCard(s){const v=mediaOf('semen',s.id),lv=v[0];return`<a class="card" href="#semenf-${esc(s.id)}"><div><b>${esc(s.stallion||'Semen')}</b> <span class="mu sm">${esc(s.id)} · ${esc(s.type||'')}</span><div class="mu sm">${esc(s.buyer||'')}${s.doses?' · '+esc(s.doses)+' doses':''}${s.ship?' · ship '+dm(s.ship):''}</div><div class="sm">${lv?v.length+' video'+(v.length>1?'s':'')+' · latest '+dm(lv.date):'<span class="mu">No videos yet</span>'}</div></div><span class="ch ${s.status=='Delivered'?'o':s.status=='Cancelled'?'r':''}">${esc(s.status||'Ordered')}</span></a>`}
function sList(q){q=q.toLowerCase();return D.semen.filter(s=>(s.id+' '+(s.stallion||'')+' '+(s.buyer||'')).toLowerCase().includes(q)).sort((a,b)=>(a.date||'')<(b.date||'')?1:-1).map(sCard).join('')||'<p class="mu">No semen files yet.</p>'}
const semen=()=>`<div class="row"><div class="hd"><h1>Semen files</h1><p class="sub">Orders for outside buyers, with daily videos they can watch</p></div><a class="btn" style="margin:14px 0 0" href="#addsemen">+ New</a></div><input id="q" placeholder="Search stallion, buyer or ID…" oninput="$('#slist').innerHTML=sList(this.value)"><div id="slist">${sList('')}</div>`;
function semenf(id){const s=sOf(id);if(!s)return hdr('Semen file','Not found',isAdm()?['#semen','Semen files']:['#home','Home']);const adm=isAdm();
 const kv=[['Stallion',s.stallion],['Buyer',s.buyer],['Semen',s.type],['Doses',s.doses],['Ordered',s.date?fd(s.date):''],['Shipping',s.ship?fd(s.ship):''],['Destination',s.dest],...(adm?[['Buyer phone',s.phone]]:[])].filter(x=>x[1]);
 return`<a class="lnk back" href="${adm?'#semen':'#home'}">‹ ${adm?'Semen files':'My semen'}</a><div class="card hd"><div class="row"><div><h1>${esc(s.stallion||'Semen')}</h1><div class="mu sm">${esc(s.id)}${s.buyer?' · '+esc(s.buyer):''}</div></div><span class="ch ${s.status=='Delivered'?'o':s.status=='Cancelled'?'r':''}">${esc(s.status||'Ordered')}</span></div>
<table class="kv">${kv.map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</table>${s.note?`<div class="sm" style="white-space:pre-wrap">${esc(s.note)}</div>`:''}
${adm?`<div class="row" style="margin-top:8px"><select style="width:150px;min-height:38px" onchange="sOf('${esc(id)}').status=this.value;save();route()">${SST.map(x=>`<option${(s.status||'Ordered')==x?' selected':''}>${x}</option>`).join('')}</select><a class="lnk sm" href="#addsemen-${esc(id)}">Edit file ›</a></div>`:''}</div>
<h2>Daily videos</h2>${mediaBox('semen',id)}`}
function addsemen(a){const s=sOf(a)||{},isNew=!s.id,nidS=()=>{let n=D.semen.length+1;while(D.semen.some(x=>x.id=='S'+String(n).padStart(3,'0')))n++;return'S'+String(n).padStart(3,'0')};
 const stl=[...new Set(D.mares.flatMap(m=>[m.stAI,m.stET]).concat(D.ais.map(x=>x.stallion),D.semen.map(x=>x.stallion)).map(x=>(x||'').trim()).filter(Boolean))].sort();
 return`${hdr(isNew?'New semen file':'Edit semen file','The buyer sees this file and its videos',[isNew?'#semen':'#semenf-'+esc(s.id),isNew?'Semen files':s.stallion||'Semen'])}
<datalist id="stL">${stl.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="buyL">${buyerNames().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
${sec('Order',`<div class="grid2"><label>File ID<input id="fsid" value="${esc(s.id||nidS())}" ${isNew?'':'readonly'}></label><label>Stallion<input id="fsst" list="stL" value="${esc(s.stallion||'')}"></label></div><label>Buyer (name used for their login)<input id="fsbu" list="buyL" value="${esc(s.buyer||'')}"></label><div class="grid2"><label>Buyer phone<input id="fsph" type="tel" value="${esc(s.phone||'')}"></label><label>Semen${sel('sty',['Fresh','Cooled','Frozen'],s.type||'Frozen')}</label><label>Doses / straws<input id="fsdo" type="number" inputmode="numeric" value="${esc(s.doses||'')}"></label><label>Status${sel('sss',SST,s.status||'Ordered')}</label><label>Order date<input id="fsda" type="date" value="${esc(s.date||today())}"></label><label>Shipping date<input id="fssh" type="date" value="${esc(s.ship||'')}"></label></div><label>Destination<input id="fsde" value="${esc(s.dest||'')}"></label><label>Note for the buyer<textarea id="fsno" rows="3">${esc(s.note||'')}</textarea></label>`)}
${sbtn('Save semen file',`saveSemen(${isNew?"''":`'${esc(s.id)}'`})`)}<p id="msg" class="sm wn"></p>`}
function saveSemen(old){const id=gv('sid').trim().replace(/[^A-Za-z0-9-]/g,'');if(!id||!gv('sst').trim()||!gv('sbu').trim()){$('#msg').textContent='ID, stallion and buyer are required.';return}
 if(!old&&D.semen.some(s=>s.id==id)){$('#msg').textContent='That ID already exists.';return}
 const v={id,stallion:gv('sst').trim(),buyer:gv('sbu').trim(),phone:gv('sph').trim(),type:gv('sty'),doses:gv('sdo'),status:gv('sss'),date:gv('sda'),ship:gv('ssh'),dest:gv('sde').trim(),note:gv('sno').trim()};
 const o=sOf(old);if(o)Object.assign(o,v);else D.semen.push(v);save();location.hash='semenf-'+id}

/* role access */
const ROLE_VIEWS={accountant:['home','files','mare','bills','bill','reports','report','prefs'],clinic_owner:['home','bills','bill','reports','report','prefs'],owner:['home','mare','reports','report','prefs'],buyer:['home','semenf','prefs']};
const RO_VIEWS={accountant:['home','files','mare'],clinic_owner:['home','bills','bill'],owner:['home','mare'],buyer:['home','semenf']};
const NAVS={admin:[['home','Home','home'],['week','Week','week'],['visits','Visits','pin'],['exam','Exam','exam'],['et','ET','et'],['bills','Bills','bills'],['prefs','Settings','settings']],
accountant:[['home','Home','home'],['files','Files','mares'],['bills','Bills','bills'],['reports','Reports','rep'],['prefs','Account','user']],
clinic_owner:[['home','Home','home'],['bills','Bills','bills'],['reports','Reports','rep'],['prefs','Account','user']],
owner:[['home','My mares','home'],['reports','Report','rep'],['prefs','Account','user']],buyer:[['home','My semen','semen'],['prefs','Account','user']]};

/* ---------- ROUTER ---------- */
function route(){PENDR=false;document.body.classList.remove('ro','own');
if(SRV.state!='ready'){$('#nav').innerHTML='';$('#app').innerHTML=gateV();gateAfter();window.scrollTo(0,0);return}
const h=decodeURIComponent(location.hash.slice(1))||'home',i=h.indexOf('-'),R=ME.role,adm=R=='admin';let v=i<0?h:h.slice(0,i),a=i<0?'':h.slice(i+1);
if(!adm&&!(ROLE_VIEWS[R]||[]).includes(v)){v='home';a=''}
const HOME=adm?home:R=='owner'?ownerHome:R=='buyer'?buyerHome:staffHome;
const V={home:HOME,files:()=>files(a),mare:()=>mare(a),exam:()=>exam(a),ai:()=>ai(a),clip:()=>clip(a),prefs:adm?settings:acctSettings,addmare:()=>addmare(a),et:()=>et(a),rscr:()=>rscrF(a),rchk:()=>rchkF(a),etrec:()=>etrecF(a),week:()=>week(a),addev:()=>addev(a),bill:()=>bill(a),bills,reports:()=>reports(a),report,visits:()=>visits(a),visit:()=>visit(a),users,semen,semenf:()=>semenf(a),addsemen:()=>addsemen(a)}[v]||HOME;
const on={files:adm?'home':'files',rscr:'et',rchk:'et',etrec:'et',mare:'home',addmare:'home',ai:'home',clip:'home',addev:'week',bill:'bills',reports:adm?'home':'reports',report:adm?'home':'reports',visit:'visits',users:'prefs',semen:'home',semenf:'home',addsemen:'home'}[v]||v;
$('#app').innerHTML=V();$('#nav').innerHTML=(NAVS[R]||NAVS.admin).map(([k,t,ic2])=>`<a href="#${k}" class="${on==k?'on':''}">${ic(ic2)}<span>${t}</span></a>`).join('');window.scrollTo(0,0);
const ro=!adm&&(RO_VIEWS[R]||[]).includes(v);document.body.classList.toggle('ro',ro);document.body.classList.toggle('own',R=='owner'||R=='buyer');
if(ro)document.querySelectorAll('#app input,#app select,#app textarea').forEach(e=>{if(e.id!='q')e.disabled=true});
if(v=='clip'){PHS.ph=[null,null,null];AIR=null;fillNote()}if(v=='exam'){PHS.ai=[null,null,null];AIR=null}fillMedia()}
addEventListener('hashchange',route);route();srvBoot();
setInterval(()=>document.querySelectorAll('.cd').forEach(e=>e.textContent=cd(+e.dataset.a,+e.dataset.b)),30000);
</script></body></html>
