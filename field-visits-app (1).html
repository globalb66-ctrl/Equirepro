<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B57">
<meta name="mobile-web-app-capable" content="yes">
<title>Field Visits Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one mobile-first column; week strip on top, the chosen day's visits as a route list, add/edit sheet below. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#17211C; --muted:#5D6B63; --line:#D9DFDA;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --sand:#B7782C; --sand-soft:#F4E7D4; --done:#7C8A82; --danger:#B3362C; --danger-soft:#F6DFDC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111815; --surface:#18221E; --ink:#E6ECE8; --muted:#97A69E; --line:#2A3631;
  --accent:#5FBF9F; --accent-ink:#0D1512; --accent-soft:#1F3A31;
  --sand:#E0A65C; --sand-soft:#3A2D1C; --done:#6F7D76; --danger:#F0877C; --danger-soft:#3D2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#18221E; --ink:#E6ECE8; --muted:#97A69E; --line:#2A3631;
  --accent:#5FBF9F; --accent-ink:#0D1512; --accent-soft:#1F3A31;
  --sand:#E0A65C; --sand-soft:#3A2D1C; --done:#6F7D76; --danger:#F0877C; --danger-soft:#3D2220; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent}
.danger{color:var(--danger);border-color:var(--danger)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .label{flex:1;font-family:var(--display);font-weight:600;font-size:1.25rem;text-align:center}
.weeknav button{min-width:44px;padding:8px 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:72px;font-weight:500}
.day .dn{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dd{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--sand)}
.day .dots i.d{background:var(--done)}
.day.today .dd{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .dn,.day[aria-pressed="true"] .dd{color:var(--accent-ink)}
.day[aria-pressed="true"] .dots i{background:var(--accent-ink)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-size:1.6rem;margin:0;font-weight:600}
.count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:0;border-left:2px dashed var(--line);margin-left:66px}
.visit{position:relative;padding:0 0 18px 22px}
.visit::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--sand)}
.visit.done::before{border-color:var(--done);background:var(--done)}
.time{position:absolute;left:-68px;top:2px;width:52px;text-align:right;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--sand);font-weight:500}
.visit.done .time{color:var(--done)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.visit.done .card{opacity:.7}
.visit.done .farm{text-decoration:line-through;text-decoration-color:var(--done)}
.farm{font-weight:700;font-size:1.08rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.chip{background:var(--sand-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:600;font-size:.78rem}
.chip.ex{background:var(--accent-soft)}
.coords{font-family:var(--mono);font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.notes{color:var(--muted);font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn,.actions button{min-height:38px;padding:6px 12px;font-size:.9rem}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--danger-soft);border-radius:10px;padding:8px 10px;font-size:.9rem}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 18px;color:var(--muted);text-align:center}
.routebar{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-family:var(--display);font-size:1.4rem;margin:0;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.hint.ok{color:var(--accent)}
.hint.bad{color:var(--danger)}
.mares{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.mares li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:.95rem;padding:6px 10px;background:var(--bg);border-radius:8px}
.mares .mn{font-weight:700;overflow-wrap:anywhere}
.mares .mt{color:var(--sand);font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.mares .mt::before{content:"→ ";color:var(--muted)}
.mareRows{display:flex;flex-direction:column;gap:8px}
.mareRow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.mareRow button{min-height:44px;padding:6px 12px}
.sectlabel{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:440px){.mareRow{grid-template-columns:1fr auto}.mareRow .tgt{grid-column:1/2}.mareRow button{grid-row:1/3;grid-column:2}}
.foot{border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.foot p{margin:0;max-width:60ch}
.foot-title{font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--ink)}
.order{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.order h3{font-family:var(--display);font-size:1.3rem;margin:0;font-weight:600}
.order ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.order li{overflow-wrap:anywhere}
.order .km{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.order .tm{font-family:var(--mono);font-size:.82rem;color:var(--sand);font-weight:500}
.order .note{font-size:.82rem;color:var(--muted)}
.formbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.banner{background:var(--sand-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:20}
@media (max-width:440px){
  .grid{grid-template-columns:1fr}
  .day{min-height:62px}.day .dd{font-size:1.25rem}
  .list{margin-left:56px}.time{left:-58px;width:44px;font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>Field Visits</h1>
      <div class="sub">Farm and stable calls, by date, time and GPS</div>
    </div>
    <button class="primary" id="addBtn" type="button">+ New visit</button>
  </header>

  <div id="storeNote" class="banner" hidden></div>

  <section aria-label="Week">
    <div class="weeknav">
      <button type="button" id="prevWk" aria-label="Previous week">‹</button>
      <div class="label" id="wkLabel">Week</div>
      <button type="button" id="todayBtn" class="ghost">Today</button>
      <button type="button" id="nextWk" aria-label="Next week">›</button>
    </div>
    <div class="days" id="days" style="margin-top:10px"></div>
  </section>

  <section aria-live="polite">
    <div class="dayhead">
      <h2 id="dayTitle">Today</h2>
      <span class="count" id="dayCount"></span>
    </div>
    <div class="routebar" id="routebar" style="margin:10px 0 16px" hidden>
      <a class="btn primary" id="routeLink" target="_blank" rel="noopener">🗺 Day route</a>
      <button type="button" id="nearBtn">↯ Nearest first</button>
      <button type="button" id="shareBtn">Share day</button>
    </div>
    <div class="order" id="orderPanel" hidden aria-live="polite"></div>
    <div id="dayList"></div>
  </section>

  <section class="panel" id="formPanel" hidden aria-labelledby="formTitle">
    <h3 id="formTitle">New visit</h3>
    <form id="visitForm" novalidate>
      <div class="grid">
        <label class="full">Farm / client
          <input id="f_farm" list="farmList" dir="auto" required placeholder="e.g. Al Nakheel Stud" autocomplete="off">
          <datalist id="farmList"></datalist>
          <span class="hint">Pick a saved farm to reuse its location.</span>
        </label>
        <label>Date<input id="f_date" type="date" required></label>
        <label>Time<input id="f_time" type="time" required></label>
        <label class="full">GPS location
          <button type="button" id="gpsBtn" class="primary" style="text-transform:none;letter-spacing:0">📍 Use my current location</button>
          <input id="f_loc" dir="ltr" placeholder="Paste a Google Maps link or 24.7136, 46.6753" autocomplete="off">
          <span class="hint" id="locHint">At the farm, tap the button above. Or paste coordinates or a Google Maps link.</span>
        </label>
        <label>Purpose
          <select id="f_purpose">
            <option>Follicle scan</option><option>Insemination</option><option>Pregnancy check</option>
            <option>Embryo flush</option><option>Pre-foaling check</option><option>Stallion collection</option>
            <option>Lameness exam</option><option>Treatment follow-up</option><option>Other</option>
          </select>
        </label>
        <label>Contact phone<input id="f_phone" type="tel" dir="ltr" placeholder="05x xxx xxxx"></label>
        <div class="full" style="display:flex;flex-direction:column;gap:8px">
          <span class="sectlabel">Mares and target</span>
          <div class="mareRows" id="mareRows"></div>
          <datalist id="mareNames"></datalist>
          <datalist id="targetList">
            <option value="Follicle scan"></option><option value="Ovulation check"></option>
            <option value="Inseminate (fresh)"></option><option value="Inseminate (chilled)"></option><option value="Inseminate (frozen)"></option>
            <option value="Induce ovulation"></option><option value="PD 14 days"></option><option value="PD 28–30 days"></option>
            <option value="PD 45–60 days"></option><option value="Twin check / pinch"></option><option value="Embryo flush"></option>
            <option value="Uterine lavage"></option><option value="Culture / cytology"></option><option value="Pre-foaling check"></option>
            <option value="Post-foaling check"></option><option value="Treatment"></option>
          </datalist>
          <button type="button" id="addMare" class="ghost" style="align-self:flex-start">+ Add mare</button>
        </div>
        <label class="full">Notes
          <textarea id="f_notes" dir="auto" placeholder="Mares to check, what to bring (semen, sedation, probe)…"></textarea>
        </label>
      </div>
      <div class="formbtns" style="margin-top:14px">
        <button type="button" class="ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary" id="saveBtn">Save visit</button>
      </div>
    </form>
  </section>

  <footer class="foot">
    <div class="foot-title">Backup</div>
    <p>Visits are saved on this phone, in this browser. Save a backup now and then, and use it to move visits to another phone.</p>
    <div class="routebar">
      <button type="button" id="exportBtn">Save backup file</button>
      <label class="btn" style="text-transform:none;letter-spacing:0;font-size:1rem;color:var(--ink);flex-direction:row">Restore backup<input type="file" id="importFile" accept="application/json,.json" hidden></label>
    </div>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const pad = n => String(n).padStart(2,"0");
  const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parseIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const weekStart = d => addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()), -d.getDay());

  let visits = [];            // {id, farm, date, time, lat, lng, link, purpose, phone, notes, done, example}
  let selected = iso(new Date());
  let editingId = null;
  let confirmId = null;
  function routeUrl(list){
    const pts=list.filter(v=>v.lat!=null);
    if(pts.length<2) return null;
    const last=pts[pts.length-1];
    const way=pts.slice(0,-1).map(v=>v.lat+","+v.lng).join("|");
    return "https://www.google.com/maps/dir/?api=1&destination="+last.lat+","+last.lng+"&waypoints="+encodeURIComponent(way)+"&travelmode=driving";
  }

  // ---------- coordinates ----------
  function parseLoc(text){
    const t = (text||"").trim();
    if(!t) return {};
    const num = "(-?\\d{1,3}\\.\\d+)";
    const pats = [
      new RegExp("!3d"+num+"!4d"+num),
      new RegExp("@"+num+","+num),
      new RegExp("[?&](?:q|query|destination|ll|daddr)=(?:loc:)?"+num+"(?:,|%2C)\\s*"+num,"i"),
      new RegExp("^"+num+"\\s*[,\\s]\\s*"+num+"$")
    ];
    for(const p of pats){
      const m = t.match(p);
      if(m){
        const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
        if(Math.abs(lat)<=90 && Math.abs(lng)<=180) return {lat,lng};
      }
    }
    if(/^https?:\/\//i.test(t)) return {link:t};
    return {bad:true};
  }
  function dirUrl(v){
    if(v.lat!=null) return "https://www.google.com/maps/dir/?api=1&destination="+v.lat+","+v.lng;
    if(v.link) return v.link;
    return null;
  }

  // ---------- storage ----------
  function lsLoad(){ try{ return JSON.parse(localStorage.getItem("fv_visits")||"[]"); }catch(e){ return []; } }
  function lsSave(){ try{ localStorage.setItem("fv_visits", JSON.stringify(visits)); }catch(e){} }

  async function saveVisit(v){
    const i=visits.findIndex(x=>x.id===v.id); if(i>=0) visits[i]=v; else visits.push(v); lsSave(); render();
  }
  async function removeVisit(id){
    visits=visits.filter(x=>x.id!==id); lsSave(); render();
  }

  function initStore(){
    visits = lsLoad();
    try{ localStorage.setItem("fv_test","1"); localStorage.removeItem("fv_test"); }
    catch(e){ const n=$("#storeNote"); n.textContent="This browser is blocking storage (private tab?). Visits won't be kept after you close it."; n.hidden=false; }
    render();
  }

  // ---------- GPS ----------
  function useGps(){
    const btn=$("#gpsBtn");
    if(!navigator.geolocation){ toast("This browser can't read GPS. Paste coordinates instead."); return; }
    btn.disabled=true; btn.textContent="Getting location…";
    navigator.geolocation.getCurrentPosition(pos=>{
      btn.disabled=false; btn.textContent="📍 Use my current location";
      $("#f_loc").value=pos.coords.latitude.toFixed(6)+", "+pos.coords.longitude.toFixed(6);
      locFeedback();
      toast("Location saved (±"+Math.round(pos.coords.accuracy)+" m)");
    }, err=>{
      btn.disabled=false; btn.textContent="📍 Use my current location";
      toast(err.code===1? "Location blocked. Allow it for this page in Chrome's site settings." : "Couldn't get a GPS fix. Turn on Location and try again.");
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  }

  // ---------- share & backup ----------
  function dayText(date, list){
    const d=parseIso(date);
    let s="Visits – "+DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]+"\n";
    list.forEach(v=>{
      s+="\n"+(v.time||"--:--")+"  "+v.farm+(v.purpose?" ("+v.purpose+")":"")+(v.done?" ✓":"")+"\n";
      mList(v).forEach(m=>{ s+="   • "+(m.name||"Mare")+(m.target?" → "+m.target:"")+"\n"; });
      if(v.lat!=null) s+="   📍 https://maps.google.com/?q="+v.lat+","+v.lng+"\n";
      else if(v.link) s+="   📍 "+v.link+"\n";
    });
    const r=routeUrl(list.filter(v=>!v.done));
    if(r) s+="\nFull route: "+r;
    return s.trim();
  }
  async function shareDay(){
    const list=visits.filter(v=>v.date===selected).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    const text=dayText(selected,list);
    if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==="AbortError") return; } }
    window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
  }
  function exportBackup(){
    const blob=new Blob([JSON.stringify({app:"field-visits",version:1,visits},null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="field-visits-backup-"+iso(new Date())+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast("Backup saved to Downloads");
  }
  function importBackup(file){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        const list=Array.isArray(data)? data : data.visits;
        if(!Array.isArray(list)) throw 0;
        const byId=new Map(visits.map(v=>[v.id,v]));
        list.forEach(v=>{ if(v && v.id && v.date) byId.set(v.id,v); });
        visits=[...byId.values()]; lsSave(); render();
        toast("Restored "+list.length+" visits");
      }catch(e){ toast("That file isn't a Field Visits backup."); }
    };
    r.readAsText(file);
  }


  // ---------- nearest-first ordering ----------
  function km(a,b){
    const R=6371, toR=Math.PI/180;
    const dLat=(b.lat-a.lat)*toR, dLng=(b.lng-a.lng)*toR;
    const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function pathLen(start,list){ let d=0,p=start; list.forEach(v=>{ if(p) d+=km(p,v); p=v; }); return d; }
  // Nearest neighbour from the start point, then 2-opt to remove crossings.
  function nearestOrder(start,stops){
    const left=[...stops], out=[];
    let cur=start||left[0];
    while(left.length){
      let bi=0,bd=Infinity;
      left.forEach((v,i)=>{ const d=km(cur,v); if(d<bd){bd=d;bi=i;} });
      cur=left.splice(bi,1)[0]; out.push(cur);
    }
    let improved=true, guard=0;
    while(improved && guard++<50){
      improved=false;
      for(let i=0;i<out.length-1;i++) for(let j=i+1;j<out.length;j++){
        const cand=[...out.slice(0,i),...out.slice(i,j+1).reverse(),...out.slice(j+1)];
        if(pathLen(start,cand)+1e-9<pathLen(start,out)){ out.splice(0,out.length,...cand); improved=true; }
      }
    }
    return out;
  }
  let pendingOrder=null;
  function getPosition(){
    return new Promise(res=>{
      if(!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    });
  }
  async function arrangeNearest(){
    const open=visits.filter(v=>v.date===selected && !v.done).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    const withLoc=open.filter(v=>v.lat!=null), noLoc=open.filter(v=>v.lat==null);
    if(withLoc.length<2){ toast("Add GPS locations to at least 2 open visits on this day first."); return; }
    const btn=$("#nearBtn"); btn.disabled=true; btn.textContent="Finding your location…";
    const here=await getPosition();
    btn.disabled=false; btn.textContent="↯ Nearest first";
    const order=nearestOrder(here,withLoc);
    const full=[...order,...noLoc];
    const slots=open.map(v=>v.time).filter(Boolean).sort();
    const times=full.map((v,i)=>slots[i]||v.time||"");
    pendingOrder={full,times};
    const before=pathLen(here,withLoc), after=pathLen(here,order);
    const p=$("#orderPanel"); p.innerHTML="";
    const h=document.createElement("h3"); h.textContent="Nearest-first order"; p.appendChild(h);
    const from=document.createElement("div"); from.className="note";
    from.textContent= here? "Starting from where you are now." : "Couldn't read your location, so it starts from the first farm.";
    p.appendChild(from);
    const ol=document.createElement("ol"); let prev=here;
    full.forEach((v,i)=>{
      const li=document.createElement("li");
      const t=document.createElement("span"); t.className="tm"; t.textContent=(times[i]||"--:--")+"  "; li.appendChild(t);
      const n=document.createElement("b"); n.textContent=v.farm||"Unnamed farm"; n.dir="auto"; li.appendChild(n);
      const k=document.createElement("span"); k.className="km";
      if(v.lat==null) k.textContent="  · no location, kept last";
      else { k.textContent= prev? "  · "+km(prev,v).toFixed(1)+" km" : "  · start"; prev=v; }
      li.appendChild(k); ol.appendChild(li);
    });
    p.appendChild(ol);
    const sum=document.createElement("div"); sum.className="note";
    sum.textContent="Total ≈ "+after.toFixed(1)+" km"+(before-after>0.05? " (saves ≈ "+(before-after).toFixed(1)+" km vs. current order)" : " (current order is already shortest)")+". Straight-line distance; road distance is longer. Applying keeps your time slots and moves the farms into them.";
    p.appendChild(sum);
    const row=document.createElement("div"); row.className="routebar";
    const ok=document.createElement("button"); ok.type="button"; ok.className="primary"; ok.textContent="Apply this order";
    const no=document.createElement("button"); no.type="button"; no.className="ghost"; no.textContent="Cancel";
    ok.onclick=applyOrder; no.onclick=()=>{ pendingOrder=null; p.hidden=true; };
    row.append(ok,no); p.appendChild(row);
    p.hidden=false;
    p.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  async function applyOrder(){
    if(!pendingOrder) return;
    const {full,times}=pendingOrder; pendingOrder=null;
    $("#orderPanel").hidden=true;
    try{
      for(let i=0;i<full.length;i++){
        const cur=visits.find(x=>x.id===full[i].id);
        if(cur && times[i] && cur.time!==times[i]) await saveVisit({...cur,time:times[i]});
      }
      render(); toast("Visits rearranged, nearest first");
    }catch(e){ toast("Couldn't save the new order. Try again."); }
  }

  // ---------- render ----------
  function render(){
    const sel = parseIso(selected);
    const ws = weekStart(sel);
    const we = addDays(ws,6);
    $("#wkLabel").textContent = ws.getDate()+" "+MONTHS[ws.getMonth()]+" – "+we.getDate()+" "+MONTHS[we.getMonth()];
    const today = iso(new Date());
    const daysEl = $("#days"); daysEl.innerHTML="";
    for(let i=0;i<7;i++){
      const d=addDays(ws,i), k=iso(d);
      const dv=visits.filter(v=>v.date===k);
      const b=document.createElement("button");
      b.type="button"; b.className="day"+(k===today?" today":"");
      b.setAttribute("aria-pressed", k===selected?"true":"false");
      b.setAttribute("aria-label", DAYS[i]+" "+d.getDate()+", "+dv.length+" visits");
      b.innerHTML='<span class="dn">'+DAYS[i]+'</span><span class="dd">'+d.getDate()+'</span><span class="dots"></span>';
      const dots=b.querySelector(".dots");
      dv.slice(0,4).forEach(v=>{ const e=document.createElement("i"); if(v.done) e.className="d"; dots.appendChild(e); });
      b.onclick=()=>{ selected=k; confirmId=null; pendingOrder=null; $("#orderPanel").hidden=true; render(); };
      daysEl.appendChild(b);
    }

    const label = selected===today ? "Today" : DAYS[sel.getDay()]+" "+sel.getDate()+" "+MONTHS[sel.getMonth()];
    $("#dayTitle").textContent = label;
    const dayVisits = visits.filter(v=>v.date===selected).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    const open = dayVisits.filter(v=>!v.done).length;
    $("#dayCount").textContent = dayVisits.length ? dayVisits.length+" visit"+(dayVisits.length>1?"s":"")+(open<dayVisits.length?" · "+open+" left":"") : "";

    // route link through all not-done visits with coordinates, in time order
    const r = routeUrl(dayVisits.filter(v=>!v.done));
    if(r){ $("#routeLink").href=r; $("#routeLink").hidden=false; } else $("#routeLink").hidden=true;
    $("#routebar").hidden = !dayVisits.length;

    const list=$("#dayList"); list.innerHTML="";
    if(!dayVisits.length){
      list.innerHTML='<div class="empty">No visits on this day.<br>Tap <b>+ New visit</b> to add a farm with its location and time.</div>';
    } else {
      const ul=document.createElement("div"); ul.className="list";
      dayVisits.forEach(v=>ul.appendChild(visitEl(v)));
      list.appendChild(ul);
    }

    const farms=[...new Set(visits.filter(v=>!v.example).map(v=>v.farm).filter(Boolean))].sort();
    $("#farmList").innerHTML = farms.map(f=>'<option value="'+esc(f)+'"></option>').join("");
  }

  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtTime(t){ return t||"--:--"; }
  function mList(v){ return Array.isArray(v.mares)? v.mares.filter(m=>m && (m.name||m.target)) : []; }

  function addMareRow(m){
    const row=document.createElement("div"); row.className="mareRow";
    const n=document.createElement("input"); n.placeholder="Mare name"; n.dir="auto"; n.setAttribute("list","mareNames"); n.className="mname"; n.autocomplete="off"; n.setAttribute("aria-label","Mare name"); n.value=m?.name||"";
    const t=document.createElement("input"); t.placeholder="Target (e.g. PD 14 days)"; t.dir="auto"; t.setAttribute("list","targetList"); t.className="tgt"; t.autocomplete="off"; t.setAttribute("aria-label","Target"); t.value=m?.target||"";
    const x=document.createElement("button"); x.type="button"; x.className="ghost"; x.textContent="✕"; x.setAttribute("aria-label","Remove mare");
    x.onclick=()=>{ row.remove(); if(!$("#mareRows").children.length) addMareRow(); };
    row.append(n,t,x);
    $("#mareRows").appendChild(row);
    return n;
  }
  function readMares(){
    return [...document.querySelectorAll("#mareRows .mareRow")].map(r=>({
      name:r.querySelector(".mname").value.trim(), target:r.querySelector(".tgt").value.trim()
    })).filter(m=>m.name||m.target);
  }
  function refreshMareNames(){
    const farm=$("#f_farm").value.trim().toLowerCase();
    const all=visits.filter(v=>!v.example);
    const same=all.filter(v=>(v.farm||"").toLowerCase()===farm).flatMap(mList).map(m=>m.name);
    const rest=all.flatMap(mList).map(m=>m.name);
    const names=[...new Set([...same,...rest].filter(Boolean))];
    $("#mareNames").innerHTML=names.map(x=>'<option value="'+esc(x)+'"></option>').join("");
  }
  $("#addMare").onclick=()=>addMareRow().focus();

  function visitEl(v){
    const w=document.createElement("div"); w.className="visit"+(v.done?" done":"");
    const url=dirUrl(v);
    w.innerHTML =
      '<span class="time">'+esc(fmtTime(v.time))+'</span>'+
      '<div class="card">'+
        '<div class="farm" dir="auto"></div>'+
        '<div class="meta"><span class="chip"></span>'+(v.example?'<span class="chip ex">Example</span>':'')+'</div>'+
        (mList(v).length?'<ul class="mares"></ul>':'')+
        (v.lat!=null?'<div class="coords">'+v.lat.toFixed(5)+', '+v.lng.toFixed(5)+'</div>':(v.link?'<div class="coords">Maps link saved</div>':'<div class="coords">No location yet</div>'))+
        (v.phone?'<div class="coords">☎ '+esc(v.phone)+'</div>':'')+
        (v.notes?'<div class="notes" dir="auto"></div>':'')+
        '<div class="actions"></div>'+
      '</div>';
    w.querySelector(".farm").textContent=v.farm||"Unnamed farm";
    w.querySelector(".chip").textContent=v.purpose||"Visit";
    if(v.notes) w.querySelector(".notes").textContent=v.notes;
    const ml=w.querySelector(".mares");
    if(ml) mList(v).forEach(m=>{
      const li=document.createElement("li");
      const n=document.createElement("span"); n.className="mn"; n.dir="auto"; n.textContent=m.name||"Mare";
      li.appendChild(n);
      if(m.target){ const t=document.createElement("span"); t.className="mt"; t.dir="auto"; t.textContent=m.target; li.appendChild(t); }
      ml.appendChild(li);
    });
    const act=w.querySelector(".actions");
    if(confirmId===v.id){
      act.innerHTML='<div class="confirm">Delete this visit? <button type="button" class="danger" data-a="yes">Delete</button><button type="button" data-a="no">Keep</button></div>';
      act.querySelector('[data-a="yes"]').onclick=async()=>{ confirmId=null; try{ await removeVisit(v.id); toast("Deleted"); }catch(e){ toast("Couldn't delete. Try again."); } };
      act.querySelector('[data-a="no"]').onclick=()=>{ confirmId=null; render(); };
      return w;
    }
    if(url){ const a=document.createElement("a"); a.className="btn primary"; a.href=url; a.target="_blank"; a.rel="noopener"; a.textContent="Directions"; act.appendChild(a); }
    const mk=(txt,fn,cls)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=txt; if(cls) b.className=cls; b.onclick=fn; act.appendChild(b); };
    mk(v.done?"Undo done":"Mark done", async()=>{ try{ await saveVisit({...v,done:!v.done}); toast(v.done?"Marked not done":"Marked done"); }catch(e){ toast("Couldn't save. Try again."); } });
    mk("Edit", ()=>openForm(v));
    if(v.phone){ const c=document.createElement("a"); c.className="btn"; c.href="tel:"+v.phone.replace(/[^\d+]/g,""); c.textContent="📞 Call"; act.appendChild(c); }
    mk("Delete", ()=>{ confirmId=v.id; render(); }, "ghost danger");
    return w;
  }

  function copyText(t){
    if(!t){ toast("No location to copy"); return; }
    try{ navigator.clipboard.writeText(t).then(()=>toast("Copied: "+t),()=>toast(t)); }catch(e){ toast(t); }
  }

  let toastT;
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

  // ---------- form ----------
  function openForm(v){
    editingId = v? v.id : null;
    $("#formTitle").textContent = v? "Edit visit" : "New visit";
    $("#f_farm").value = v?.farm||"";
    $("#f_date").value = v?.date||selected;
    $("#f_time").value = v?.time||"08:00";
    $("#f_loc").value = v? (v.lat!=null? v.lat+", "+v.lng : (v.link||"")) : "";
    $("#f_purpose").value = v?.purpose||"Follicle scan";
    $("#f_phone").value = v?.phone||"";
    $("#f_notes").value = v?.notes||"";
    $("#mareRows").innerHTML="";
    const ms = v? mList(v) : [];
    (ms.length? ms : [null]).forEach(m=>addMareRow(m));
    refreshMareNames();
    locFeedback();
    $("#formPanel").hidden=false;
    $("#formPanel").scrollIntoView({behavior:"smooth",block:"start"});
    $("#f_farm").focus({preventScroll:true});
  }
  function closeForm(){ $("#formPanel").hidden=true; editingId=null; }

  function locFeedback(){
    const r=parseLoc($("#f_loc").value), h=$("#locHint");
    h.className="hint";
    if(r.lat!=null){ h.textContent="✓ Location found: "+r.lat.toFixed(5)+", "+r.lng.toFixed(5); h.classList.add("ok"); }
    else if(r.link){ h.textContent="Short link saved as-is. Directions will open it in Maps. For the day route, paste coordinates instead."; }
    else if(r.bad){ h.textContent="Couldn't read a location. Paste coordinates like 24.7136, 46.6753 or a full Google Maps link."; h.classList.add("bad"); }
    else h.textContent="At the farm, tap the button above. Or paste coordinates or a Google Maps link.";
  }
  $("#f_loc").addEventListener("input",locFeedback);
  $("#f_farm").addEventListener("change",()=>{
    refreshMareNames();
    if($("#f_loc").value.trim()) return;
    const name=$("#f_farm").value.trim().toLowerCase();
    const prev=[...visits].reverse().find(v=>!v.example && (v.farm||"").toLowerCase()===name && (v.lat!=null||v.link));
    if(prev){
      $("#f_loc").value = prev.lat!=null? prev.lat+", "+prev.lng : prev.link;
      if(!$("#f_phone").value) $("#f_phone").value=prev.phone||"";
      locFeedback();
    }
  });

  $("#visitForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const farm=$("#f_farm").value.trim(), date=$("#f_date").value, time=$("#f_time").value;
    if(!farm){ $("#f_farm").focus(); toast("Add the farm or client name"); return; }
    if(!date){ $("#f_date").focus(); toast("Pick a date"); return; }
    const loc=parseLoc($("#f_loc").value);
    if(loc.bad){ $("#f_loc").focus(); toast("Fix the location or leave it empty"); return; }
    const prev = editingId? visits.find(v=>v.id===editingId) : null;
    const v = {
      id: editingId || ("v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      farm, date, time,
      lat: loc.lat ?? null, lng: loc.lng ?? null, link: loc.link || null,
      mares: readMares(),
      purpose: $("#f_purpose").value, phone: $("#f_phone").value.trim(), notes: $("#f_notes").value.trim(),
      done: prev? !!prev.done : false, example:false
    };
    $("#saveBtn").disabled=true;
    try{
      await saveVisit(v);
      selected=date; closeForm(); render(); toast("Saved");
    }catch(err){ toast("Couldn't save ("+(err&&err.code||"error")+"). Try again."); }
    finally{ $("#saveBtn").disabled=false; }
  });

  $("#addBtn").onclick=()=>openForm(null);
  $("#gpsBtn").onclick=useGps;
  $("#shareBtn").onclick=shareDay;
  $("#nearBtn").onclick=arrangeNearest;
  $("#exportBtn").onclick=exportBackup;
  $("#importFile").onchange=e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=""; };
  $("#cancelBtn").onclick=closeForm;
  $("#prevWk").onclick=()=>{ selected=iso(addDays(parseIso(selected),-7)); render(); };
  $("#nextWk").onclick=()=>{ selected=iso(addDays(parseIso(selected),7)); render(); };
  $("#todayBtn").onclick=()=>{ selected=iso(new Date()); render(); };

  render();
  initStore();
})();
</script>

</body>
</html>
